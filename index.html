<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ski aktuell</title>
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ski">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f2f2f7" id="themeColor">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
/* Ski aktuell – Designsystem
   Richtung: Apple iOS/macOS, ruhig und hochwertig. Liquid Glass nur für schwebende Bedienelemente
   (Gebietsnavigation, Statusleiste, Farbmenü, Kartenknöpfe, Webcam-Ansicht); Inhalte stehen auf festen Flächen.
   Farben: Voreinstellung „Automatisch“ (hell/dunkel nach System), weitere Paletten über data-palette am html-Element. */
:root{
  /* Typografie */
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,system-ui,sans-serif;
  --font-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",Roboto,system-ui,sans-serif;
  --display:var(--font-display); --body:var(--font); --mono:var(--font); --sans:var(--font);
  --fs-xs:.6875rem; --fs-sm:.8125rem; --fs-md:.9375rem; --fs-lg:1.0625rem; --fs-xl:1.375rem;
  /* Abstände, Radien */
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px;
  --r-sm:10px; --r-md:14px; --r-lg:20px; --r-pill:999px;
  /* Bewegung */
  --ease:cubic-bezier(.2,.8,.2,1); --dur:.22s;
  /* Farben: Hell */
  --bg:#f2f2f7; --surface:#ffffff; --fill:#f2f2f7; --fg:#1d1d1f; --muted:#6e6e73; --line:rgba(60,60,67,.12);
  --card-line:rgba(0,0,0,.04); --shadow-card:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.05);
  --shadow-lift:0 2px 6px rgba(0,0,0,.06),0 14px 32px rgba(0,0,0,.08);
  --accent:#0071e3; --accent-soft:#e6f0fc; --on-accent:#fff; --snow:#0a64c2;
  --up:#1f8a3b; --down:#d70015; --warm:#b25000; --cool:#0071e3;
  --glass:rgba(250,250,252,.72); --glass-solid:#f9f9fb; --glass-line:rgba(0,0,0,.08); --glass-hi:rgba(255,255,255,.7);
  --glass-shadow:0 8px 32px rgba(0,0,0,.10),0 1px 2px rgba(0,0,0,.05);
  --seg-on:#ffffff; --seg-on-fg:#1d1d1f; --seg-shadow:0 1px 3px rgba(0,0,0,.12),0 1px 1px rgba(0,0,0,.04);
  color-scheme:light;
}
/* Dunkel (automatisch oder gewählt) */
@media (prefers-color-scheme:dark){
  :root:not([data-palette]){
    --bg:#0e1013; --surface:#1a1c20; --fill:#24272c; --fg:#f5f5f7; --muted:#9a9aa1; --line:rgba(255,255,255,.08);
    --card-line:rgba(255,255,255,.06); --shadow-card:none; --shadow-lift:0 10px 30px rgba(0,0,0,.35);
    --accent:#4ba3ff; --accent-soft:rgba(75,163,255,.15); --on-accent:#06121f; --snow:#cfe6ff;
    --up:#32d15a; --down:#ff6b61; --warm:#ffb340; --cool:#64d2ff;
    --glass:rgba(30,32,37,.62); --glass-solid:#1e2025; --glass-line:rgba(255,255,255,.10); --glass-hi:rgba(255,255,255,.06);
    --glass-shadow:0 10px 36px rgba(0,0,0,.45);
    --seg-on:#3a3d44; --seg-on-fg:#f5f5f7; --seg-shadow:0 1px 3px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-palette="dunkel"]{
  --bg:#0e1013; --surface:#1a1c20; --fill:#24272c; --fg:#f5f5f7; --muted:#9a9aa1; --line:rgba(255,255,255,.08);
  --card-line:rgba(255,255,255,.06); --shadow-card:none; --shadow-lift:0 10px 30px rgba(0,0,0,.35);
  --accent:#4ba3ff; --accent-soft:rgba(75,163,255,.15); --on-accent:#06121f; --snow:#cfe6ff;
  --up:#32d15a; --down:#ff6b61; --warm:#ffb340; --cool:#64d2ff;
  --glass:rgba(30,32,37,.62); --glass-solid:#1e2025; --glass-line:rgba(255,255,255,.10); --glass-hi:rgba(255,255,255,.06);
  --glass-shadow:0 10px 36px rgba(0,0,0,.45);
  --seg-on:#3a3d44; --seg-on-fg:#f5f5f7; --seg-shadow:0 1px 3px rgba(0,0,0,.4);
  color-scheme:dark;
}
:root[data-palette="gletscher"]{
  --bg:#0c1620; --surface:#122130; --fill:#183048; --fg:#e4edf3; --muted:#8aa0b2; --line:#22384a;
  --card-line:#1b2e40; --shadow-card:none; --shadow-lift:0 10px 30px rgba(0,0,0,.35);
  --accent:#7cc4ea; --accent-soft:#17324a; --on-accent:#0c1620; --snow:#cfe9f8;
  --up:#6cc890; --down:#ee8a72; --warm:#f0a070; --cool:#8fbcf0;
  --glass:rgba(18,33,48,.66); --glass-solid:#122130; --glass-line:rgba(124,196,234,.16); --glass-hi:rgba(255,255,255,.05);
  --glass-shadow:0 10px 36px rgba(0,0,0,.45);
  --seg-on:#22405a; --seg-on-fg:#e4edf3; --seg-shadow:0 1px 3px rgba(0,0,0,.4);
  color-scheme:dark;
}
:root[data-palette="nacht"]{
  --bg:#050202; --surface:#0d0505; --fill:#1a0806; --fg:#ff6a5c; --muted:#c2513f; --line:#2a0f0c;
  --card-line:#2a0f0c; --shadow-card:none; --shadow-lift:none;
  --accent:#e8604f; --accent-soft:#2a0806; --on-accent:#050202; --snow:#ff8a7c;
  --up:#ff6a5c; --down:#d5584b; --warm:#ff6a5c; --cool:#b44a3e;
  --glass:rgba(13,5,5,.7); --glass-solid:#0d0505; --glass-line:#2a0f0c; --glass-hi:transparent; --glass-shadow:none;
  --seg-on:#2a0f0c; --seg-on-fg:#ff6a5c; --seg-shadow:none;
  color-scheme:dark;
}

/* ---------- Grundlagen ---------- */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:var(--fs-md);line-height:1.47;letter-spacing:-.005em;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Statusleisten-Bereich (iPhone): Glas, damit Inhalte darunter weich verschwinden */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--glass-solid);z-index:30}
.wrap > *{min-width:0}
.wrap{max-width:600px;margin:0 auto;padding-left:max(var(--sp-4),env(safe-area-inset-left,0px));padding-right:max(var(--sp-4),env(safe-area-inset-right,0px));padding-block:var(--sp-5) 40px;display:grid;gap:var(--sp-4)}
a{color:var(--accent)}
button{font-family:inherit}
:focus-visible{outline:none}
button:focus-visible,a:focus-visible,summary:focus-visible,.ovc:focus-visible{outline:none;box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}
[hidden]{display:none!important}
svg{display:block;width:100%;height:auto}
svg text{font-family:var(--font);font-size:10px;fill:var(--muted)}

/* ---------- Kopf ---------- */
header{display:flex;justify-content:space-between;align-items:flex-end;gap:var(--sp-3);padding-top:var(--sp-2)}
.eyebrow{font-size:var(--fs-xs);font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--font-display);font-weight:700;font-size:clamp(1.75rem,8vw,2.125rem);line-height:1.1;margin:2px 0 0;letter-spacing:-.025em;white-space:nowrap}
.hbtns{position:relative;display:flex;gap:var(--sp-2);align-items:center}
.iconbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;padding:0;cursor:pointer;color:var(--accent);
  background:var(--surface);border:1px solid var(--card-line);box-shadow:var(--shadow-card);transition:transform var(--dur) var(--ease),background var(--dur)}
.iconbtn svg{width:20px;height:20px}
.iconbtn:active{transform:scale(.92)}
.refresh[disabled]{cursor:default}
.refresh[disabled] svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Farbmenü – Glas */
.pal-menu{position:absolute;right:0;top:calc(100% + 10px);z-index:40;min-width:220px;padding:6px;display:grid;gap:2px;
  border-radius:var(--r-md);border:1px solid var(--glass-line);background:var(--glass-solid);box-shadow:var(--glass-shadow),inset 0 1px 0 var(--glass-hi);
  transform-origin:top right;animation:pop .18s var(--ease)}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(-4px)}}
.pal-title{font-size:var(--fs-xs);font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:8px 10px 4px}
.pal-item{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;color:var(--fg);font:500 var(--fs-md) var(--font);padding:9px 10px;border-radius:var(--r-sm);cursor:pointer;text-align:left;min-height:40px}
.pal-item:hover{background:color-mix(in srgb,var(--fg) 6%,transparent)}
.pal-item[aria-checked="true"]{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.pal-item[aria-checked="true"]::after{content:"";margin-left:auto;width:14px;height:8px;border:solid var(--accent);border-width:0 0 2px 2px;transform:translateY(-2px) rotate(-45deg)}
.pal-item .sw{display:flex;border-radius:6px;overflow:hidden;box-shadow:0 0 0 1px var(--line);flex:none}
.pal-item .sw i{width:11px;height:20px}

/* Gebietsauswahl – schwebende Glasleiste (Segmented Control) */
.tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--sp-2));z-index:20;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;
  padding:4px;border-radius:var(--r-pill);border:1px solid var(--glass-line);background:var(--glass-solid);box-shadow:var(--glass-shadow),inset 0 1px 0 var(--glass-hi)}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto;font:600 var(--fs-sm) var(--font);border:0;background:transparent;color:var(--muted);border-radius:var(--r-pill);padding:0 16px;min-height:38px;cursor:pointer;white-space:nowrap;
  transition:background var(--dur) var(--ease),color var(--dur) var(--ease),box-shadow var(--dur) var(--ease)}
.tabs button:hover{color:var(--fg)}
.tabs button[aria-selected="true"]{background:var(--seg-on);color:var(--seg-on-fg);box-shadow:var(--seg-shadow)}
@supports ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .tabs,.pal-menu,body::before,.mapbox .mapgo,.camnav,.vbar{background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
}

.status{font-size:var(--fs-sm);color:var(--muted);display:flex;align-items:center;gap:var(--sp-2);padding:0 var(--sp-1)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--up);flex:none}
.status .dot{box-shadow:0 0 0 3px color-mix(in srgb,var(--up) 22%,transparent)}
.status.stale .dot{background:var(--warm);box-shadow:0 0 0 3px color-mix(in srgb,var(--warm) 22%,transparent)}

/* ---------- Karten ---------- */
.card{background:var(--surface);border:1px solid var(--card-line);border-radius:var(--r-lg);box-shadow:var(--shadow-card);overflow:hidden;container-type:inline-size}
.card h2{font-family:var(--font-display);font-weight:600;font-size:var(--fs-lg);letter-spacing:-.015em;margin:0;padding:var(--sp-4) var(--sp-5) var(--sp-2);display:flex;justify-content:space-between;align-items:baseline;gap:4px 8px;flex-wrap:wrap}
.card h2 small{font:400 var(--fs-sm) var(--font);color:var(--muted);letter-spacing:0}
.card .note{font-size:var(--fs-sm);color:var(--muted);padding:var(--sp-3) var(--sp-5) var(--sp-4);border-top:1px solid var(--line)}
.card .pad{padding:var(--sp-1) var(--sp-5) var(--sp-4)}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:var(--sp-4);align-items:center;padding:var(--sp-3) var(--sp-5);border-top:1px solid var(--line)}
.card h2 + .row{border-top:0}
.row .lbl{font-weight:500;min-width:0}
.row .lbl span{display:block;font-size:var(--fs-sm);color:var(--muted);font-weight:400}
.row .v{text-align:right;font-weight:600;white-space:nowrap}
.row .v small{display:block;font-size:var(--fs-xs);font-weight:400;color:var(--muted)}

/* Pistenplan */
.mapbox{position:relative;height:clamp(280px,78vw,480px);border-top:1px solid var(--line);background:var(--fill)}
.mapbox iframe{position:absolute;inset:0;width:100%;height:100%;border:0;pointer-events:none}
.mapbox.on iframe{pointer-events:auto}
.mapbox .mapgo{position:absolute;inset:auto 0 44px;margin:auto;width:max-content;font:600 var(--fs-sm) var(--font);padding:10px 16px;border-radius:var(--r-pill);
  border:1px solid var(--glass-line);background:var(--glass-solid);color:var(--fg);cursor:pointer;box-shadow:var(--glass-shadow),inset 0 1px 0 var(--glass-hi);transition:transform var(--dur) var(--ease)}
.mapbox .mapgo:active{transform:scale(.96)}
.mapbox.on .mapgo{display:none}

/* ---------- Hero (Detail) ---------- */
.hero{background:var(--surface);border:1px solid var(--card-line);border-radius:var(--r-lg);box-shadow:var(--shadow-card);padding:var(--sp-5);display:grid;gap:var(--sp-4)}
.bigrow{display:flex;align-items:flex-end;gap:clamp(10px,3vw,16px);flex-wrap:wrap}
.big{font-family:var(--font-display);font-weight:700;font-size:clamp(3rem,15vw,4.5rem);line-height:.95;letter-spacing:-.045em;color:var(--snow);margin-top:2px}
.big small{font-size:.28em;font-weight:600;color:var(--muted);margin-left:5px;letter-spacing:0}
.fc{display:grid;gap:1px;padding:2px 0 6px clamp(10px,3vw,14px);border-left:1px solid var(--line);min-width:0}
.fc .fl,.depthbig .fl,.depthrow .fl,.stats .fl{font-size:var(--fs-xs);font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-family:var(--font)}
.fc .fv{font:600 clamp(1rem,4vw,1.15rem)/1.25 var(--font);white-space:nowrap}
.fc .fd{font-size:var(--fs-xs);color:var(--muted);white-space:nowrap}
.depthbig{display:grid;grid-template-columns:repeat(auto-fit,minmax(7.5em,1fr));gap:var(--sp-3) clamp(12px,4vw,20px)}
.depthbig > div{display:grid;gap:4px;min-width:0}
.depthbig > div + div{padding-left:clamp(12px,4vw,20px);border-left:1px solid var(--line)}
.depthbig .fd{font-size:var(--fs-sm);color:var(--muted)}
.nsrow{padding-top:var(--sp-4);border-top:1px solid var(--line)}
.depthrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(8em,1fr));gap:var(--sp-2) var(--sp-4)}
.depthrow > div{display:grid;gap:2px;min-width:0}
.depthrow .fv{font:600 1.25rem/1.25 var(--font);letter-spacing:-.01em}
.depthrow .fd{font-size:var(--fs-sm);color:var(--muted)}
.pills{display:flex;flex-wrap:wrap;gap:var(--sp-2)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:var(--r-pill);font-size:var(--fs-sm);font-weight:600;background:var(--accent-soft);color:var(--fg);width:fit-content}
.pill.soft{background:var(--fill);font-weight:500;color:var(--muted)}
.opstate{display:flex;align-items:center;gap:var(--sp-2);font-size:var(--fs-md);font-weight:600;flex-wrap:wrap}
.opstate .dot{background:var(--muted)}
.opstate.on .dot{background:var(--up);box-shadow:0 0 0 3px color-mix(in srgb,var(--up) 22%,transparent)}
.opstate em{font-style:normal;font-weight:500;font-size:var(--fs-sm);color:var(--warm)}
.card h2 small.stale{color:var(--warm)}

/* ---------- Lawine (offizielle EAWS-Farben) ---------- */
.lv{display:inline-grid;place-items:center;min-width:28px;height:28px;padding:0 7px;border-radius:8px;font:700 var(--fs-md) var(--font);color:#111;flex:none}
.lv1{background:#ccff66}.lv2{background:#ffff00}.lv3{background:#ff9900}.lv4{background:#ff3b30;color:#fff}.lv5{background:repeating-linear-gradient(45deg,#ff3b30 0 6px,#111 6px 12px);color:#fff}.lv0{background:var(--fill);color:var(--muted)}
.lawhead{display:flex;gap:var(--sp-3);align-items:center;padding:var(--sp-1) var(--sp-5) var(--sp-4)}
.lawhead b{display:block;font-weight:600}
.lawhead span{font-size:var(--fs-sm);color:var(--muted)}
.probs{display:flex;flex-wrap:wrap;gap:6px;padding:0 var(--sp-5) var(--sp-4)}
.probs span{font-size:var(--fs-sm);background:var(--fill);border-radius:var(--r-pill);padding:5px 12px;color:var(--fg)}
.probs span em{font-style:normal;color:var(--muted);font-size:var(--fs-xs);margin-left:4px}

/* ---------- Übersicht ---------- */
.ov{display:grid;gap:var(--sp-3)}
.ovc{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:var(--surface);border:1px solid var(--card-line);border-radius:var(--r-lg);
  box-shadow:var(--shadow-card);padding:var(--sp-4) var(--sp-5) var(--sp-5);cursor:pointer;transition:transform var(--dur) var(--ease),box-shadow var(--dur) var(--ease)}
.ovc{container-type:inline-size;display:flex;flex-direction:column}
.ovc .stats{margin-top:auto}
.ovc .t{margin-bottom:var(--sp-4)}
@container (max-width:400px){.ovc .t .lw .lwl{display:none}}
@media (hover:hover){.ovc:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift)}.ovc:hover .chev{transform:translateX(2px);color:var(--accent)}}
.ovc:active{transform:scale(.985)}
.ovc .t{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--sp-3)}
.ovc .t > div:first-child{flex:1 1 0;min-width:0}
.ovc .t b{font-family:var(--font-display);font-weight:600;font-size:var(--fs-xl);letter-spacing:-.02em;line-height:1.2}
.ovc .t span.r{display:block;font-size:var(--fs-sm);color:var(--muted);margin-top:2px}
.ovc .t span.r.inv{color:var(--warm)}
.ovc .t .lw{flex:none;display:flex;align-items:center;gap:var(--sp-2);font-size:var(--fs-sm);color:var(--muted);padding-top:4px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(5.6em,1fr));gap:var(--sp-3);margin-top:var(--sp-4);padding-top:var(--sp-4);border-top:1px solid var(--line)}
.stats > div{min-width:0}
.stats > div + div{border-left:1px solid var(--line);padding-left:var(--sp-3)}
.stats .fl{white-space:nowrap}
.stats .fv{font:600 1.5rem/1.2 var(--font-display);letter-spacing:-.02em;margin-top:2px}
.stats .fv small{font-size:.6em;font-weight:500;color:var(--muted);letter-spacing:0}
.stats .fv.snow{color:var(--snow)}
.stats .fd{font-size:var(--fs-xs);color:var(--muted);white-space:nowrap}
.best{margin-top:var(--sp-4);padding:10px 12px;border-radius:var(--r-sm);background:var(--accent-soft);font-size:var(--fs-sm);color:var(--fg)}
.best b{color:var(--accent);font-weight:600}
.chev{width:16px;height:16px;color:var(--muted);margin-left:2px;flex:none;transition:transform var(--dur) var(--ease),color var(--dur)}

/* ---------- Tagesverlauf, 7 Tage ---------- */
.hours{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:var(--sp-1);padding:var(--sp-1) var(--sp-3) var(--sp-3)}
.hc{display:grid;justify-items:center;gap:6px;padding:var(--sp-2) 2px;border-radius:var(--r-sm);text-align:center}
.hc .hh{font-size:var(--fs-xs);font-weight:500;color:var(--muted)}
.hc .ht{font-weight:600;font-size:var(--fs-lg)}
.hc .hs{font-size:var(--fs-xs);color:var(--muted);line-height:1.2}
.wi{width:28px;height:28px;display:block}
.hint{display:flex;align-items:center;gap:var(--sp-2);padding:0 var(--sp-5) var(--sp-4);font-size:var(--fs-sm);color:var(--fg)}
.hint .wi{width:20px;height:20px;flex:none}
.note b.sunsum{color:var(--warm);font-weight:600}
.note b.closed{color:var(--fg);font-weight:600}
.day{display:grid;grid-template-columns:4.4em minmax(0,1fr) auto auto;gap:4px var(--sp-3);align-items:center;padding:var(--sp-3) var(--sp-5);border-top:1px solid var(--line)}
.card h2 + .day{border-top:0}
.day .d{font-weight:600}
@container (max-width: 21em){
  .day{display:flex;flex-wrap:wrap}
  .day .d{flex:0 0 4.4em}.day .w{flex:1 1 7em}.day .s{margin-left:auto}
}
.day .d span{display:block;font-size:var(--fs-xs);font-weight:400;color:var(--muted)}

<script>
"use strict";
/* ---------- Grundlagen ---------- */
const HOURLY = "temperature_2m,snowfall,snow_depth,freezing_level_height,weather_code,wind_gusts_10m,cloud_cover,sunshine_duration,visibility,precipitation";
const DAILY = "weather_code,temperature_2m_max,temperature_2m_min,snowfall_sum,precipitation_sum,sunshine_duration,wind_gusts_10m_max,daylight_duration";
const CURRENT = "temperature_2m,weather_code,wind_gusts_10m,snowfall";
const PALETTES = [
  ["auto","Automatisch",["#f2f2f7","#0071e3","#1a1c20"]],
  ["hell","Hell",["#f2f2f7","#ffffff","#0071e3"]],
  ["dunkel","Dunkel",["#0e1013","#1a1c20","#4ba3ff"]],
  ["gletscher","Gletscher",["#0c1620","#7cc4ea","#cfe9f8"]],
  ["nacht","Nachtsicht (rot)",["#050202","#E8604F","#FF8A7C"]],
];
function syncThemeColor(){
  const m = document.getElementById("themeColor");
  if(m) m.setAttribute("content", getComputedStyle(document.documentElement).getPropertyValue("--bg").trim() || "#f2f2f7");
}
try{ matchMedia("(prefers-color-scheme: dark)").addEventListener("change", syncThemeColor); }catch(e){}
const LEVEL = {low:1, moderate:2, considerable:3, high:4, very_high:5};
const LEVEL_TXT = ["keine Einstufung","gering","mäßig","erheblich","groß","sehr groß"];
const PROBLEM = {new_snow:"Neuschnee", wind_slab:"Triebschnee", persistent_weak_layers:"Altschnee", wet_snow:"Nassschnee",
  gliding_snow:"Gleitschnee", cornices:"Wechten", favourable_situation:"Günstige Situation", no_distinct_avalanche_problem:"Kein ausgeprägtes Problem"};
const TEND = {increasing:"steigend", steady:"gleichbleibend", decreasing:"abnehmend"};
const PERIOD = {earlier:"vormittags", later:"nachmittags"};
const ASPECTS = ["N","NE","E","SE","S","SW","W","NW"];
const ASP_DE = {N:"N",NE:"NO",E:"O",SE:"SO",S:"S",SW:"SW",W:"W",NW:"NW"};
const WD = ["So","Mo","Di","Mi","Do","Fr","Sa"];
const REGION_DE = {"AT-08-01":"Bregenzerwaldgebirge","AT-08-02":"Allgäuer Alpen West","AT-08-03-01":"Lechtaler Alpen Vorarlberg",
  "AT-08-03-02":"Lechquellengebirge","AT-08-04":"Verwall West","AT-08-05-01":"Rätikon Ost","AT-08-05-02":"Rätikon West","AT-08-06":"Silvretta West","AT-08-07":"Voralpen"};

let LOADING = true, RES = [], WX = null, WX_LIVE = false, LAW = null, STAT = null, HIST = null, VIEW = "overview";
const $ = id => document.getElementById(id);
function load(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }
function save(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function esc(s){ return String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
const fmt0 = v => (v == null || !isFinite(v)) ? "–" : Math.round(v).toString();
const fmtT = v => (v == null || !isFinite(v)) ? "–" : (Math.round(v) === 0 ? "0" : Math.round(v).toString().replace("-", "−")) + "°";
const cm = v => (v == null || !isFinite(v)) ? "–" : (v > 0 && v < 1 ? "<1" : Math.round(v).toString());

function wxText(c){
  if(c == null) return "–";
  if(c === 0) return "Klar"; if(c === 1) return "Überwiegend klar"; if(c === 2) return "Teils bewölkt"; if(c === 3) return "Bedeckt";
  if(c === 45 || c === 48) return "Nebel"; if(c >= 51 && c <= 57) return "Nieselregen";
  if(c === 61) return "Leichter Regen"; if(c === 63) return "Regen"; if(c === 65) return "Starker Regen"; if(c === 66 || c === 67) return "Gefrierender Regen";
  if(c === 71) return "Leichter Schneefall"; if(c === 73) return "Schneefall"; if(c === 75) return "Starker Schnee"; if(c === 77) return "Schneegriesel";
  if(c >= 80 && c <= 82) return "Regenschauer"; if(c === 85) return "Schneeschauer"; if(c === 86) return "Kräftige Schneeschauer";
  if(c >= 95) return "Gewitter"; return "–";
}

/* ---------- Daten je Messpunkt ---------- */
function activeResorts(){ return RES.filter(r => r.aktiv !== false); }
function allPoints(){ return activeResorts().flatMap(r => r.points); }
function apiUrl(){
  const p = allPoints(), j = k => p.map(x => x[k]).join(",");
  return "https://api.open-meteo.com/v1/forecast?latitude=" + j("lat") + "&longitude=" + j("lon") + "&elevation=" + j("elev") +
    "&current=" + CURRENT + "&hourly=" + HOURLY + "&daily=" + DAILY + "&past_days=7&forecast_days=7&timezone=Europe%2FBerlin&wind_speed_unit=kmh";
}
function pointData(r, i){
  if(!WX) return null;
  let k = 0;
  for(const x of activeResorts()){ if(x === r) return WX[k + i] || null; k += x.points.length; }
  return null;
}
function nowIdx(d){
  const key = d.current.time.slice(0,13) + ":00", t = d.hourly.time;
  let i = t.indexOf(key);
  if(i < 0){ i = 0; while(i + 1 < t.length && t[i+1] <= d.current.time) i++; }
  return i;
}
function sumSnow(d, from, to){
  let s = 0; const a = d.hourly.snowfall;
  for(let i = Math.max(0, from); i <= Math.min(a.length - 1, to); i++) s += a[i] || 0;
  return s;
}
function pointStats(d){
  if(!d || !d.current || !d.hourly) return null;
  const i = nowIdx(d), h = d.hourly;
  const di = d.daily.time.indexOf(d.current.time.slice(0,10));
  return {
    i, di,
    temp: d.current.temperature_2m, code: d.current.weather_code, gust: d.current.wind_gusts_10m,
    past24: sumSnow(d, i-23, i), past72: sumSnow(d, i-71, i),
    next24: sumSnow(d, i+1, i+24), next72: sumSnow(d, i+1, i+72),
    depth: h.snow_depth[i] != null ? h.snow_depth[i] * 100 : null,
    freezing: h.freezing_level_height[i],
  };
}

/* ---------- Sonne und Tal ---------- */
function sunHours(d, k){ const v = d && d.daily && d.daily.sunshine_duration ? d.daily.sunshine_duration[k] : null; return v == null ? null : v / 3600; }
function daylightHours(d, k){ const v = d && d.daily && d.daily.daylight_duration ? d.daily.daylight_duration[k] : null; return v == null ? null : v / 3600; }
function talPoint(r){ return r.points.length > 1 ? pointData(r, 0) : null; }
// Hochnebel: laut Vorhersage im Tal kaum Sonne, am Berg deutlich mehr
function inversion(r, k){
  const b = sunHours(pointData(r, r.points.length - 1), k), t = sunHours(talPoint(r), k);
  return b != null && t != null && t < 1.5 && b >= 3 && b - t >= 2;
}
function hourKind(d, i){
  const H = d.hourly, c = H.weather_code[i];
  if((c >= 71 && c <= 77) || c === 85 || c === 86) return "snow";
  if((c >= 51 && c <= 67) || (c >= 80 && c <= 82)) return "rain";
  if(c === 45 || c === 48 || (H.visibility && H.visibility[i] != null && H.visibility[i] < 1000)) return "fog";
  const sun = H.sunshine_duration ? H.sunshine_duration[i] : null;
  if(sun != null) return sun >= 2160 ? "sun" : sun >= 720 ? "partly" : "cloud";
  const cc = H.cloud_cover ? H.cloud_cover[i] : 50;
  return cc < 30 ? "sun" : cc < 70 ? "partly" : "cloud";
}
const KIND_TXT = {sun:"sonnig", partly:"teils sonnig", cloud:"bewölkt", snow:"Schneefall", rain:"Regen", fog:"Nebel"};
function wxIcon(kind){
  const sun = `<circle cx="12" cy="12" r="4.2" fill="var(--warm)"/><g stroke="var(--warm)" stroke-width="1.6" stroke-linecap="round"><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></g>`;
  const cloud = (y, col) => `<path d="M7 ${18+y}h10.5a3.6 3.6 0 0 0 .4-7.2 5.2 5.2 0 0 0-10-1.1A3.9 3.9 0 0 0 7 ${18+y}z" fill="${col}"/>`;
  const g = {
    sun,
    partly: `<g transform="translate(-3,-3) scale(.8)">${sun}</g>` + cloud(1, "var(--muted)"),
    cloud: cloud(0, "var(--muted)"),
    snow: cloud(-3, "var(--muted)") + `<g fill="var(--snow)"><circle cx="8.5" cy="19.5" r="1.2"/><circle cx="12.5" cy="21" r="1.2"/><circle cx="16.5" cy="19.5" r="1.2"/></g>`,
    rain: cloud(-3, "var(--muted)") + `<g stroke="var(--cool)" stroke-width="1.6" stroke-linecap="round"><path d="M9 18.5l-1 2.5M13 18.5l-1 2.5M17 18.5l-1 2.5"/></g>`,
    fog: `<g stroke="var(--muted)" stroke-width="1.8" stroke-linecap="round"><path d="M4 9h16M6 13h12M4 17h16"/></g>`,
  }[kind];
  return `<svg class="wi" viewBox="0 0 24 24" aria-hidden="true">${g}</svg>`;
}
/* Tagesverlauf am Berg: heute, ab 15 Uhr morgen; 8 bis 16 Uhr im Zwei-Stunden-Takt */
function dayCourseHTML(r, d, s){
  if(!d.hourly.sunshine_duration && !d.hourly.cloud_cover) return "";
  const now = d.current.time, tomorrow = Number(now.slice(11,13)) >= 15;
  const k = s.di + (tomorrow ? 1 : 0); if(k < 0 || k >= d.daily.time.length) return "";
  const date = d.daily.time[k], P = r.points[r.points.length - 1];
  const cells = [8,10,12,14,16].map(hh => {
    const i = d.hourly.time.indexOf(date + "T" + String(hh).padStart(2,"0") + ":00"); if(i < 0) return "";
    const kind = hourKind(d, i), sn = sumSnow(d, i - 1, i);
    return `<div class="hc" title="${KIND_TXT[kind]}"><span class="hh">${hh} Uhr</span>${wxIcon(kind)}<span class="ht">${fmtT(d.hourly.temperature_2m[i])}</span><span class="hs">${sn >= 0.5 ? "+" + Math.max(1, Math.round(sn)) + " cm" : KIND_TXT[kind]}</span></div>`;
  }).join("");
  const sun = sunHours(d, k), day = daylightHours(d, k);
  let vis = "";
  if(d.hourly.visibility){
    let minV = Infinity; for(const hh of [9,10,11,12,13,14,15]){ const i = d.hourly.time.indexOf(date + "T" + String(hh).padStart(2,"0") + ":00"); if(i >= 0 && d.hourly.visibility[i] != null) minV = Math.min(minV, d.hourly.visibility[i]); }
    if(minV < 1000) vis = " · zeitweise Nebel, Sicht unter 1 km";
  }
  const inv = inversion(r, k) ? `<div class="hint">${wxIcon("sun")}Laut Vorhersage im Tal trüb, am Berg sonnig (Hochnebel).</div>` : "";
  return `<div class="card"><h2>${tomorrow ? "Morgen" : "Heute"} am Berg <small>${esc(P.name)} ${P.elev} m</small></h2>
    <div class="hours">${cells}</div>

}

/* ---------- Bester Skitag ----------
   Punkte je Tag (heute bis +6): frischer Schnee vom Vortag und der Nacht (bis 45), Sonnenstunden (bis 35),
   wenig Wind (bis 20, starke Böen kosten Punkte), Abzug für Dauerschneefall, große Kälte und Lawinenstufe ≥ 4.
   Nur Tage mit genug Schnee am Berg (Modell ≥ 30 cm oder offene Lifte laut Skigebiet) zählen.
   Markiert wird der beste Tag, wenn er mindestens 50 Punkte erreicht. */
function bestDay(r){
  const top = r.points.length - 1, d = pointData(r, top), s = pointStats(d);
  if(!s || s.di < 1) return null;
  const D = d.daily, H = d.hourly, st = STAT && STAT[r.id];
  const liftsOpen = st && st.lifts && st.lifts.open > 0;
  let best = null;
  for(let k = s.di; k < Math.min(D.time.length, s.di + 7); k++){
    const hi = H.time.indexOf(D.time[k] + "T12:00"), depth = hi >= 0 ? (H.snow_depth[hi] || 0) * 100 : 0;
    if(depth < 30 && !(k === s.di && liftsOpen)) continue;
    const fresh = (D.snowfall_sum[k-1] || 0) + 0.5 * (D.snowfall_sum[k] || 0);
    const sun = (D.sunshine_duration[k] || 0) / 3600, gust = D.wind_gusts_10m_max[k] || 0;
    let p = Math.min(fresh, 30) / 30 * 45 + Math.min(sun, 8) / 8 * 35 + (gust < 40 ? 20 : gust < 60 ? 10 : gust < 80 ? -10 : -30);
    if((D.snowfall_sum[k] || 0) > 15) p -= 10;
    if((D.temperature_2m_max[k] ?? 0) < -15) p -= 5;
    const L = lawFor(r, D.time[k]); if(L && L.lv >= 4) p -= 15;
    if(!best || p > best.p) best = {k, p};
  }
  if(!best || best.p < 50) return null;
  const dt = new Date(D.time[best.k] + "T12:00:00");
  best.label = best.k === s.di ? "heute" : best.k === s.di + 1 ? "morgen" : WD[dt.getDay()] + " " + dt.getDate() + "." + (dt.getMonth()+1) + ".";
  return best;
}

/* ---------- Lawinenlage ---------- */
function todayStr(){ return new Date().toLocaleDateString("sv-SE", {timeZone:"Europe/Vienna"}); }
function lawFor(r, day){
  if(!LAW || !LAW.days || !r.lawine || !r.lawine.length) return null;
  const regions = LAW.days[day]; if(!regions) return null;
  let best = null;
  for(const want of r.lawine){
    for(const [id, e] of Object.entries(regions)){
      if(id !== want && !id.startsWith(want + "-")) continue;
      const lv = maxLevel(e);
      if(!best || lv > best.lv) best = {lv, e, id};
    }
  }
  return best;
}
function maxLevel(e){ return Math.max(0, ...e.ratings.map(x => LEVEL[x.value] || 0)); }
function elevTxt(el){
  if(!el) return "";
  if(el.lowerBound) return "über " + (el.lowerBound === "treeline" ? "der Waldgrenze" : el.lowerBound + " m");
  if(el.upperBound) return "unter " + (el.upperBound === "treeline" ? "der Waldgrenze" : el.upperBound + " m");
  return "";
}
function ratingDetail(e){
  const rs = e.ratings.filter(x => LEVEL[x.value]);
  if(rs.length <= 1) return "";
  return rs.map(x => [PERIOD[x.period], elevTxt(x.elevation)].filter(Boolean).join(", ") + ": " + LEVEL[x.value] + " " + LEVEL_TXT[LEVEL[x.value]]).join(" · ");
}

function wireCams(r){

/* Große Ansicht: alle Webcams des Gebiets nebeneinander. Wischen, Pfeile oder Pfeiltasten wechseln;
   ✕, Esc, Zurück-Geste, Tipp auf die schwarze Fläche oder Wischen nach unten schließen.
   Solange sie offen ist, ist die Seite dahinter gesperrt (inert) und nur die sichtbare Webcam erreichbar. */
let VIEWER_CLOSE = null;
function openViewer(r, start, opener){
  const cams = r.webcams, v = $("viewer"), page = document.querySelector(".wrap");
  v.innerHTML = `<div class="vbar"><b>${esc(r.name)}</b><span data-vcount aria-live="polite"></span><button type="button" class="vclose" data-vclose aria-label="Schließen">✕</button></div>
    <div class="vstrip" data-vstrip>` + cams.map(c => `<figure><div class="vimg"><img src="${esc(camSrc(c, true))}" alt="Webcam ${esc(c.name)}" decoding="async" onerror="this.parentNode.classList.add('err')"></div>
      <figcaption>${esc(c.name)}${c.link ? ` · <a href="${esc(c.link)}" target="_blank" rel="noopener">Webcam-Seite ↗</a>` : ""}</figcaption></figure>`).join("") + `</div>
    ${cams.length > 1 ? `<button type="button" class="camnav prev" data-vstep="-1" aria-label="Vorherige Webcam">${CHEV_L}</button><button type="button" class="camnav next" data-vstep="1" aria-label="Nächste Webcam">${CHEV_R}</button>` : ""}`;
  v.hidden = false; document.body.style.overflow = "hidden"; page.inert = true;
  const strip = v.querySelector("[data-vstrip]"), count = v.querySelector("[data-vcount]"), figs = [...strip.children];
  const prev = v.querySelector(".prev"), next = v.querySelector(".next");
  const cur = () => Math.max(0, Math.min(cams.length - 1, Math.round(strip.scrollLeft / strip.clientWidth)));
  const go = k => strip.scrollTo({left: Math.max(0, Math.min(cams.length - 1, k)) * strip.clientWidth, behavior: "smooth"});
  const show = () => {
    const k = cur();
    count.textContent = cams.length > 1 ? (k + 1) + " / " + cams.length : "";
    figs.forEach((f, i) => { f.inert = i !== k; });
    if(prev){ prev.hidden = k === 0; next.hidden = k === cams.length - 1; }
  };
  strip.addEventListener("scroll", show, {passive:true});
  requestAnimationFrame(() => { strip.scrollLeft = start * strip.clientWidth; show(); });
  v.querySelectorAll("[data-vstep]").forEach(b => b.onclick = () => go(cur() + Number(b.dataset.vstep)));
  // Zurück-Geste: eigener Verlaufsschritt, „Zurück“ schließt nur die große Ansicht
  try{ history.pushState({viewer:true}, ""); }catch(e){}
  const onPop = () => close(true);
  window.addEventListener("popstate", onPop);
  const key = e => {
    if(e.key === "Tab"){
      const f = [...v.querySelectorAll("button:not([hidden]), a[href]")].filter(x => !x.closest("[inert]"));
      if(!f.length) return;
      const i = f.indexOf(document.activeElement);
      if(e.shiftKey && i <= 0){ e.preventDefault(); f[f.length - 1].focus(); }
      else if(!e.shiftKey && i === f.length - 1){ e.preventDefault(); f[0].focus(); }
    }
    else if(e.key === "Escape") close();
    else if(e.key === "ArrowRight") go(cur() + 1);
    else if(e.key === "ArrowLeft") go(cur() - 1);
  };
  document.addEventListener("keydown", key);
  // Tipp auf die schwarze Fläche schließt (nicht auf Bild, Link oder Knöpfe)
  strip.addEventListener("click", e => { if(!e.target.closest("img, a")) close(); });
  // Wischen nach unten schließt
  let y0 = null, x0 = null;
  strip.addEventListener("touchstart", e => { y0 = e.touches[0].clientY; x0 = e.touches[0].clientX; }, {passive:true});
  strip.addEventListener("touchend", e => {
    if(y0 == null) return;
    const dy = e.changedTouches[0].clientY - y0, dx = Math.abs(e.changedTouches[0].clientX - x0);

    if(v.hidden) return;
    v.hidden = true; v.innerHTML = ""; document.body.style.overflow = ""; page.inert = false;
    document.removeEventListener("keydown", key); window.removeEventListener("popstate", onPop);
    VIEWER_CLOSE = null;
    if(!fromPop){ try{ if(history.state && history.state.viewer) history.back(); }catch(e){} }
    if(opener) opener.focus({preventScroll:true});
  }
  VIEWER_CLOSE = close;
  v.querySelector("[data-vclose]").onclick = () => close();
  v.querySelector("[data-vclose]").focus();
}
function lawineHTML(r){

  }).join("") + `</div>`;
  const tomorrow = new Date(Date.now() + 864e5).toLocaleDateString("sv-SE", {timeZone:"Europe/Vienna"});
  const T = lawFor(r, tomorrow);
  const tend = L.e.tendency && L.e.tendency[0] ? "Tendenz " + TEND[L.e.tendency[0]] : "";
  const note = [T ? "Morgen: Stufe " + T.lv + " – " + LEVEL_TXT[T.lv] : tend].filter(Boolean).join(" · ");
  h += `<div class="note">${esc(note || "")}${note ? " · " : ""}<a href="https://warnung.vorarlberg.at/vtgdb/dist/index.html#//lwd_lagebericht.html" rel="noopener" style="color:var(--accent)">Ganzer Bericht ↗</a></div></div>`;
  return h;
}
function daysHTML(r, d, s){
  const D = d.daily, tal = pointData(r, 0), B = bestDay(r);
  let h = `<div class="card"><h2>7 Tage <small>Wetter · Sonne · Neuschnee · Temperatur</small></h2>`;
  for(let k = Math.max(0, s.di); k < D.time.length && k < s.di + 7; k++){
    const dt = new Date(D.time[k] + "T12:00:00");
    const name = k === s.di ? "Heute" : k === s.di + 1 ? "Morgen" : WD[dt.getDay()];
    const sn = D.snowfall_sum[k], sun = D.sunshine_duration[k] != null ? Math.round(D.sunshine_duration[k] / 3600) : null;
    const talMax = tal && tal.daily ? tal.daily.temperature_2m_max[k] : null;
    const day = daylightHours(d, k), pct = sun != null && day ? Math.min(100, Math.round(sunHours(d, k) / day * 100)) : null;
    let talTxt = "";
    if(tal && tal.daily && r.points.length > 1){
      const tsn = tal.daily.snowfall_sum[k] || 0, tpr = tal.daily.precipitation_sum ? tal.daily.precipitation_sum[k] || 0 : 0;
      talTxt = tsn >= 0.5 ? "Tal +" + Math.max(1, Math.round(tsn)) : tpr >= 1 ? "Tal Regen" : "Tal –";
    }
    const isBest = B && B.k === k;
    h += `<div class="day${k === s.di ? " today" : ""}${isBest ? " bestday" : ""}">
      <div class="d">${name}<span>${dt.getDate()}.${dt.getMonth()+1}.</span></div>
      <div class="w">${wxText(D.weather_code[k])}<span>${isBest ? "<b>Bester Tag</b> · " : ""}${pct != null ? `<span class="sunbar" title="${pct} % der hellen Zeit sonnig"><i style="width:${pct}%"></i></span>` : ""}${sun != null ? sun + " h Sonne" : ""}</span></div>
      <div class="s${sn >= 0.5 ? "" : " z"}">${sn >= 0.5 ? "+" + Math.max(1, Math.round(sn)) : "0"}${talTxt ? `<small>${talTxt}</small>` : ""}</div>
      <div class="t">${fmtT(D.temperature_2m_min[k])} / ${fmtT(D.temperature_2m_max[k])}${talMax != null && r.points.length > 1 ? `<br><i>Tal ${fmtT(talMax)}</i>` : ""}</div>
    </div>`;
  }
  return h + `<div class="note">Neuschnee in cm am Berg, darunter im Tal. Temperatur am Berg (min / max), darunter Höchstwert im Tal. Der Balken zeigt, wie viel der hellen Zeit sonnig ist.${B ? " „Bester Tag“: frischer Schnee, viel Sonne, wenig Wind." : ""}</div></div>`;
}
function chartHTML(d, s){
  const D = d.daily, from = Math.max(0, s.di - 7), n = D.time.length - from;
  const vals = D.snowfall_sum.slice(from), W = 340, H = 144, padB = 24, padT = 16;
  const max = Math.max(10, ...vals.map(v => v || 0)), bw = W / n;
  const Y = v => H - padB - (v / max) * (H - padB - padT);
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Neuschnee pro Tag, letzte und nächste Woche">`;
  svg += `<line x1="0" x2="${W}" y1="${H - padB}" y2="${H - padB}" stroke="var(--line)"/>`;
  vals.forEach((v, j) => {
    const k = from + j, x = j * bw + bw * 0.18, w = bw * 0.64, past = k < s.di, today = k === s.di;
    const y = Y(v || 0), hh = H - padB - y;
    if(hh > 0) svg += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${hh.toFixed(1)}" rx="2" fill="${past ? "var(--muted)" : "var(--snow)"}" opacity="${past ? .45 : today ? 1 : .8}"/>`;
    if(v >= 1) svg += `<text x="${(x + w/2).toFixed(1)}" y="${(y - 4).toFixed(1)}" text-anchor="middle" fill="var(--fg)">${Math.round(v)}</text>`;
    const dt = new Date(D.time[k] + "T12:00:00");
    svg += `<text x="${(x + w/2).toFixed(1)}" y="${H - 8}" text-anchor="middle"${today ? ' fill="var(--accent)" font-weight="600"' : ""}>${WD[dt.getDay()]}</text>`;
    if(today) svg += `<circle cx="${(x + w/2).toFixed(1)}" cy="${H - 2}" r="2" fill="var(--accent)"/>`;
  });
  svg += `</svg>`;
  return `<div class="card"><h2>Schneefall <small>Berg · cm pro Tag</small></h2><div class="pad">${svg}</div>
    <div class="legend"><span><i style="background:var(--muted);opacity:.45"></i>letzte 7 Tage</span><span><i style="background:var(--snow)"></i>Vorhersage</span><span><i class="dot"></i>heute</span></div></div>`;
}
function karteHTML(r){
  if(!r.karte) return "";
  return `<div class="card"><h2>Pistenplan <small>interaktiv · Intermaps</small></h2>
    <div class="mapbox" data-map><iframe src="${esc(r.karte)}" title="Pistenplan ${esc(r.name)}" loading="lazy" referrerpolicy="no-referrer"></iframe>
      <button type="button" class="mapgo" data-mapon>Antippen zum Bewegen</button></div>
    <div class="pad" style="padding-top:12px"><a class="btn" href="${esc(r.karte)}" target="_blank" rel="noopener">Pistenplan im Vollbild ↗</a></div></div>`;
}
function liftsHTML(r){
  const st = STAT && STAT[r.id];
  const link = `<a class="btn" href="${esc(r.live || r.web)}" rel="noopener">Live-Info des Skigebiets ↗</a>`;
  if(!st) return `<div class="card"><h2>Lifte &amp; Pisten</h2><div class="note" style="border-top:0">Noch keine Daten vom Skigebiet.</div><div class="pad">${link}</div></div>`;
  const when = st.updated ? new Date(st.updated).toLocaleString("de-DE",{day:"numeric",month:"numeric",hour:"2-digit",minute:"2-digit"}) : "";
  const age = reportAge(st);
  let h = `<div class="card"><h2>Lifte &amp; Pisten <small${age ? ' class="stale"' : ""}>${esc(age || when)}</small></h2>`;
  if(allClosed(st)){
    const start = seasonStart(r);
    return h + `<div class="note" style="border-top:0"><b class="closed">${start ? "Saisonstart am " + start : "Zurzeit sind alle Lifte geschlossen."}</b><br>
      ${fmt0(st.lifts.total)} Lifte${st.slopes && st.slopes.total ? " · " + fmt0(st.slopes.total) + " " + esc(st.slopes.unit || "") + " Pisten" : ""}. Sobald die ersten Anlagen laufen, erscheinen hier der Status und die Schneehöhe des Skigebiets.</div>
      <div class="pad">${link}</div></div>`;
  }
  if(st.lifts) h += `<div class="row"><div class="lbl">Lifte offen</div><div></div><div class="v">${fmt0(st.lifts.open)} / ${fmt0(st.lifts.total)}</div></div>`;
  if(st.slopes) h += `<div class="row"><div class="lbl">Pisten offen</div><div></div><div class="v">${fmt0(st.slopes.open)} / ${fmt0(st.slopes.total)} ${esc(st.slopes.unit || "")}</div></div>`;
  if(st.valley_run) h += `<div class="row"><div class="lbl">Talabfahrt</div><div></div><div class="v">${esc(st.valley_run)}</div></div>`;
  const sn = st.snow || {};
  if(sn.mountain != null || sn.valley != null){
    h += `<div class="row"><div class="lbl">Schneehöhe laut Skigebiet<span>${esc([st.condition, st.last_snowfall ? "letzter Schneefall: " + st.last_snowfall : ""].filter(Boolean).join(" · "))}</span></div>
      <div class="v">${sn.valley != null ? cm(sn.valley) + " cm" : "–"}<small>Tal</small></div><div class="v">${sn.mountain != null ? cm(sn.mountain) + " cm" : "–"}<small>Berg</small></div></div>`;
  }
  const groups = [["lift","Lifte"],["piste","Pisten"],["route","Skirouten"]];
  for(const [kind, title] of groups){
    const its = (st.items || []).filter(i => i.kind === kind);
    if(!its.length) continue;
    const open = its.filter(i => i.open === true).length, known = its.some(i => i.open != null);
    h += `<details><summary>${title} <span class="cnt">${known ? open + " von " + its.length + " offen" : its.length}</span></summary>` +
      its.slice().sort((a,b) => (b.open === true) - (a.open === true)).map(it =>
        `<div class="item"><span>${esc(it.name)}${it.type ? `<i>${esc(it.type)}</i>` : ""}</span><span class="o ${it.open ? "y" : "n"}">${it.open === true ? "offen" : it.open === false ? (it.state && !/^geschlossen$/i.test(it.state) ? esc(it.state) : "zu") : "–"}</span></div>`).join("") + `</details>`;
  }
  return h + `<div class="note">${link}</div></div>`;
}
function seasonHTML(r){
  const all = HIST && HIST.resorts && HIST.resorts[r.id] || [];
  const t = new Date(), y = t.getMonth() >= 8 ? t.getFullYear() : t.getFullYear() - 1;
  const pts = all.filter(e => e.d >= y + "-10-01");
  let h = `<div class="card"><h2>Saisonverlauf <small>Schneehöhe Berg und Tal</small></h2>`;
  if(pts.length < 2) return h + `<div class="note" style="border-top:0">Der Verlauf füllt sich ab jetzt täglich.</div></div>`;
  // je Höhe eine Linie: Meldung des Skigebiets, sobald es eine gibt, sonst Modell (gestrichelt)
  const repB = pts.some(e => e.b > 0), repT = pts.some(e => e.t > 0), hasT = pts.some(e => e.mt != null || e.t > 0);
  const series = [{name:"Berg", key: repB ? "b" : "m", rep: repB, col:"var(--snow)"}];
  if(hasT) series.push({name:"Tal", key: repT ? "t" : "mt", rep: repT, col:"var(--accent)"});
  const W = 340, H = 150, pl = 30, pr = 8, pt = 10, pb = 22;
  const t0 = Date.parse(pts[0].d), t1 = Date.parse(pts[pts.length-1].d), span = Math.max(t1 - t0, 864e5 * 6);
  const vals = pts.flatMap(e => series.map(sr => e[sr.key]).filter(v => v != null));
  const max = Math.max(50, Math.ceil(Math.max(0, ...vals) / 50) * 50);
  const X = d => pl + (Date.parse(d) - t0) / span * (W - pl - pr), Y = v => H - pb - v / max * (H - pt - pb);
  const line = key => { let path = "", pen = false; for(const e of pts){ if(e[key] == null){ pen = false; continue; } path += (pen ? "L" : "M") + X(e.d).toFixed(1) + " " + Y(e[key]).toFixed(1); pen = true; } return path; };
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Schneehöhe am Berg und im Tal in dieser Saison">`;
  for(let v = 0; v <= max; v += max / 2){ svg += `<line x1="${pl}" x2="${W - pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${pl - 6}" y="${Y(v) + 3}" text-anchor="end">${v}</text>`; }
  for(const sr of series) svg += `<path d="${line(sr.key)}" fill="none" stroke="${sr.col}" stroke-width="${sr.rep ? 2 : 1.6}"${sr.rep ? "" : ' stroke-dasharray="4 3"'}/>`;
  const months = ["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
  for(let m = new Date(t0); m <= new Date(t0 + span); m = new Date(m.getFullYear(), m.getMonth() + 1, 1)){
    const first = new Date(m.getFullYear(), m.getMonth(), 1), d = first.getTime() < t0 ? new Date(t0) : first;
    svg += `<text x="${Math.min(X(d.toLocaleDateString("sv-SE")), W - pr - 12)}" y="${H - 6}">${months[d.getMonth()]}</text>`;
  }
  svg += `</svg>`;
  const last = pts[pts.length - 1];
  const legend = series.map(sr => `<span><i class="${sr.rep ? "solid" : "dash"}" style="--c:${sr.col}"></i>${sr.name} ${cm(last[sr.key])} cm</span>`).join("");
  const src = series.every(sr => sr.rep) ? "laut Skigebiet" : series.every(sr => !sr.rep) ? "Modell (gestrichelt)" : "durchgezogen: Skigebiet · gestrichelt: Modell";
  return h + `<div class="pad">${svg}</div><div class="legend">${legend}<span>${src}</span></div></div>`;
}

/* ---------- Farben ---------- */
function buildPalette(){
  const cur = document.documentElement.getAttribute("data-palette") || "auto";
  $("palMenu").innerHTML = `<div class="pal-title">Darstellung</div>` + PALETTES.map(([id, n, c]) =>
    `<button type="button" class="pal-item" role="menuitemradio" data-p="${id}" aria-checked="${id === cur}"><span class="sw">${c.map(x => `<i style="background:${x}"></i>`).join("")}</span>${n}</button>`).join("");
  $("palMenu").querySelectorAll(".pal-item").forEach(b => b.onclick = () => {
    const p = b.dataset.p;
    if(p === "auto") document.documentElement.removeAttribute("data-palette"); else document.documentElement.setAttribute("data-palette", p);
    try{ localStorage.setItem("ski-palette", p); }catch(e){}
    syncThemeColor();
    buildPalette(); toggleMenu(false);
  });
}
function toggleMenu(open){ $("palMenu").hidden = !open; $("palBtn").setAttribute("aria-expanded", open); }
$("palBtn").onclick = e => { e.stopPropagation(); toggleMenu($("palMenu").hidden); };
document.addEventListener("click", e => { if(!$("palMenu").contains(e.target)) toggleMenu(false); });

/* ---------- Laden ---------- */
async function getJSON(url, ms = 15000){
  const ctrl = new AbortController(), to = setTimeout(() => ctrl.abort(), ms);
  try{ const r = await fetch(url, {signal: ctrl.signal, cache: "no-store"}); if(!r.ok) throw new Error("HTTP " + r.status); return await r.json(); }
  finally{ clearTimeout(to); }
}
const valid = w => Array.isArray(w) && w.length === allPoints().length && w.every(x => x && x.current && x.hourly && x.daily);
async function refresh(){
  LOADING = true; if(!WX) render();
  $("refresh").disabled = true;
  try{
    const cfg = await getJSON("resorts.json?t=" + Date.now());
    RES = cfg.resorts || []; save("ski-resorts", RES);
  }catch(e){ RES = load("ski-resorts") || RES; }
  const [w, l, st, hi] = await Promise.allSettled([
    (async () => { try{ let x = await getJSON(apiUrl()); if(!Array.isArray(x)) x = [x]; if(valid(x)) return {x, live:true}; }catch(e){}
                   const f = await getJSON("weather.json?t=" + Date.now()); if(valid(f)) return {x:f, live:false}; throw new Error("kein Wetter"); })(),
    getJSON("lawine.json?t=" + Date.now()),
    getJSON("status.json?t=" + Date.now()),
    getJSON("history.json?t=" + Date.now()),
  ]);
  if(w.status === "fulfilled"){ WX = w.value.x; WX_LIVE = w.value.live; save("ski-wx", WX); }
  else { const c = load("ski-wx"); WX = valid(c) ? c : null; WX_LIVE = false; }
  if(l.status === "fulfilled"){ LAW = l.value; save("ski-law", LAW); } else LAW = load("ski-law");
  if(st.status === "fulfilled"){ STAT = st.value; save("ski-stat", STAT); } else STAT = load("ski-stat");
  if(hi.status === "fulfilled"){ HIST = hi.value; save("ski-hist", HIST); } else HIST = load("ski-hist");
  const ok = !!WX && WX_LIVE;
  $("status").classList.toggle("stale", !ok);
  const wt = WX && WX[0] && WX[0].current ? WX[0].current.time : null;
  $("statusText").textContent = !WX ? "Keine Daten erreichbar" :
    (WX_LIVE ? "Live" : "Gespeicherte Daten") + (wt ? " · Wetter von " + (wt.slice(0,10) === new Date().toLocaleDateString("sv-SE") ? "" : Number(wt.slice(8,10)) + "." + Number(wt.slice(5,7)) + ". ") + wt.slice(11,16) + " Uhr" : "");
  LOADING = false;
  render();
  $("refresh").disabled = false;
}
$("refresh").onclick = refresh;
VIEW = location.hash.slice(1) || load("ski-view") || "overview";
RES = load("ski-resorts") || [];
buildPalette(); syncThemeColor();
refresh();
setInterval(() => { if(document.visibilityState === "visible") refresh(); }, 15 * 60 * 1000);
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible") refresh(); });
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
