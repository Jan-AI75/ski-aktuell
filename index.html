<head>

<meta name="mobile-web-app-capable" content="yes">

<style>
/* Layout: eine Spalte fürs Handy — Gebietsauswahl, Übersicht aller Gebiete oder Detail eines Gebiets
   (Neuschnee, Lawinenlage, Wetter je Höhe, 7-Tage-Vorhersage, Schneefall-Verlauf, Lifte & Pisten).
   Farben: Paletten über data-palette am html-Element, Voreinstellung Gletscher (dunkel). */
:root{
  --bg:#0c1620; --surface:#122130; --fg:#e4edf3; --muted:#8aa0b2; --line:#22384a;
  --accent:#7cc4ea; --accent-soft:#17324a; --snow:#cfe9f8; --up:#6cc890; --down:#ee8a72;
  --warm:#f0a070; --cool:#8fbcf0; --statusbar:var(--bg);
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
:root[data-palette="graphit"]{--bg:#111316;--surface:#1a1d21;--fg:#e9ebee;--muted:#959ca6;--line:#2a2e34;--accent:#7fb4ff;--accent-soft:#1d2a3d;--snow:#dbe7ff;--statusbar:var(--bg)}
:root[data-palette="schwarz"]{--bg:#000;--surface:#0e0f11;--fg:#f3f4f5;--muted:#8b9097;--line:#23262a;--accent:#5fb8f0;--accent-soft:#0f2236;--snow:#d6ecfa;--statusbar:#000}
:root[data-palette="nacht"]{--bg:#000;--surface:#0A0404;--fg:#FF6A5C;--muted:#C2513F;--line:#2A0F0C;--accent:#E8604F;--accent-soft:#2A0806;--snow:#FF8A7C;--up:#FF6A5C;--down:#D5584B;--warm:#FF6A5C;--cool:#B44A3E;--statusbar:#000}
:root[data-palette="hell"]{--bg:#eef3f6;--surface:#fff;--fg:#10283a;--muted:#5a7284;--line:#d3dee6;--accent:#1f6f9b;--accent-soft:#d3e7f3;--snow:#2a7fb0;--up:#2c7a4b;--down:#b4472f;--warm:#c2552f;--cool:#2f6fb4;--statusbar:#10283a;color-scheme:light}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--statusbar);z-index:10}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:.9375rem;line-height:1.45;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap > *{min-width:0}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 32px;display:grid;gap:16px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:700;font-size:clamp(1.25rem,5.6vw,1.6rem);margin:0;letter-spacing:-.01em;white-space:nowrap}
.eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hbtns{position:relative;display:flex;gap:8px;align-items:center}
button.refresh{font:500 .84rem var(--body);color:var(--accent);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 16px;min-height:44px;cursor:pointer}
button.refresh[disabled]{opacity:.6}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pal-btn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;padding:0}
.pal-dot{width:16px;height:16px;border-radius:50%;background:conic-gradient(var(--accent) 0 50%,var(--snow) 50% 75%,var(--muted) 75%)}
.pal-menu{position:absolute;right:0;top:calc(100% + 8px);z-index:20;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px;min-width:190px;box-shadow:0 10px 30px rgba(0,0,0,.35);display:grid;gap:2px}
.pal-title{font-family:var(--mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:6px 10px 4px}
.pal-item{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;color:var(--fg);font:500 .9rem var(--body);padding:8px 10px;border-radius:9px;cursor:pointer;text-align:left}
.pal-item[aria-checked="true"]{background:color-mix(in srgb,var(--accent) 16%,transparent)}
.pal-item .sw{display:flex;border-radius:5px;overflow:hidden;border:1px solid var(--line);flex:none}
.pal-item .sw i{width:12px;height:18px}
/* Gebietsauswahl */
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-4px;padding:2px 4px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;font:600 .86rem var(--body);border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:0 16px;min-height:44px;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.status{font-size:.78rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--up);flex:none}
.status.stale .dot{background:var(--warm)}
/* Karten */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.card h2{font-family:var(--display);font-weight:500;font-size:1.05rem;margin:0;padding:12px 16px 4px;display:flex;justify-content:space-between;align-items:baseline;gap:4px 8px;flex-wrap:wrap}
.card h2 small{font:400 .74rem var(--mono);color:var(--muted)}
.card .note{font-size:.78rem;color:var(--muted);padding:8px 16px 12px;border-top:1px solid var(--line)}
.card .pad{padding:4px 16px 14px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:11px 16px;border-top:1px solid var(--line)}
.card h2 + .row{border-top:0}
.row .lbl{font-weight:500;min-width:0}
.row .lbl span{display:block;font-size:.78rem;color:var(--muted);font-weight:400}
.row .v{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;font-weight:500;white-space:nowrap}
.row .v small{display:block;font-size:.76rem;font-weight:400;color:var(--muted)}
/* Hero */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:grid;gap:10px}
.bigrow{display:flex;align-items:flex-end;gap:clamp(10px,3vw,16px);flex-wrap:wrap}
.big{font-family:var(--display);font-weight:700;font-size:clamp(2.6rem,13vw,4rem);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.03em;color:var(--snow)}
.big small{font-size:.3em;font-weight:500;color:var(--muted);margin-left:4px;letter-spacing:0}
.fc{display:grid;gap:1px;padding:2px 0 6px clamp(10px,3vw,14px);border-left:1px solid var(--line);font-variant-numeric:tabular-nums;min-width:0}
.fc .fl{font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-family:var(--mono)}
.fc .fv{font:500 clamp(.95rem,4vw,1.12rem)/1.2 var(--mono);white-space:nowrap}
.fc .fd{font-size:.72rem;color:var(--muted);white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:.8rem;font-weight:600;background:var(--accent-soft);color:var(--fg);width:fit-content}
/* Lawine */
.lv{display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 6px;border-radius:7px;font:700 .9rem var(--mono);color:#111;flex:none}
.lv1{background:#ccff66}.lv2{background:#ffff00}.lv3{background:#ff9900}.lv4{background:#ff3b30;color:#fff}.lv5{background:repeating-linear-gradient(45deg,#ff3b30 0 6px,#111 6px 12px);color:#fff}.lv0{background:var(--line);color:var(--muted)}
.lawhead{display:flex;gap:12px;align-items:center;padding:6px 16px 12px}
.lawhead b{display:block;font-weight:600}
.lawhead span{font-size:.8rem;color:var(--muted)}
.probs{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 12px}
.probs span{font-size:.78rem;border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--fg)}
.probs span em{font-style:normal;color:var(--muted);font-family:var(--mono);font-size:.72rem;margin-left:4px}
/* Übersicht */
.ov{display:grid;gap:10px}
.ovc{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px 14px;cursor:pointer}
.ovc .t{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ovc .t > div:first-child{flex:1 1 0;min-width:0}
.ovc .t .lw{flex:none}
.ovc .t b{font-family:var(--display);font-weight:500;font-size:1.1rem}
.ovc .t span.r{display:block;font-size:.76rem;color:var(--muted)}
.ovc .t .lw{display:flex;align-items:center;gap:8px;font-size:.78rem;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(5.6em,1fr));gap:8px;margin-top:10px}
.stats > div{border-left:1px solid var(--line);padding-left:10px;min-width:0}
.stats > div:first-child{border-left:0;padding-left:0}
.stats .fl{font-size:.64rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-family:var(--mono)}
.stats .fv{font:500 1.15rem/1.2 var(--mono);font-variant-numeric:tabular-nums}
.stats .fv.snow{color:var(--snow)}
.stats .fd{font-size:.72rem;color:var(--muted)}
.stats .fl{white-space:nowrap}
/* 7 Tage */
.day{display:grid;grid-template-columns:4.2em minmax(0,1fr) auto auto;gap:4px 10px;align-items:center;padding:10px 16px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.card h2 + .day{border-top:0}
.day .d{font-weight:600}
.card{container-type:inline-size}
@container (max-width: 21em){
  .day{display:flex;flex-wrap:wrap}
  .day .d{flex:0 0 4.2em}.day .w{flex:1 1 7em}.day .s{margin-left:auto}
}
.day .d span{display:block;font:400 .72rem var(--mono);color:var(--muted)}
.day .w{font-size:.84rem;color:var(--muted);min-width:0;line-height:1.3}
.day .w span{display:block;font:400 .72rem var(--mono);overflow:hidden;text-overflow:ellipsis}
.day .s{font:500 .95rem var(--mono);color:var(--snow);text-align:right;min-width:4.2ch}
.day .s.z{color:var(--muted);opacity:.6}
.day .t{font:400 .84rem var(--mono);text-align:right;white-space:nowrap}
.day .t i{font-style:normal;color:var(--muted)}
.day.today{background:color-mix(in srgb,var(--accent) 7%,transparent)}
svg{display:block;width:100%;height:auto}
svg text{font-family:var(--mono);font-size:10px;fill:var(--muted)}
.legend{display:flex;gap:16px;flex-wrap:wrap;padding:0 16px 12px;font-size:.76rem;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:10px;border-radius:2px;vertical-align:middle;margin-right:6px}
a.btn,button.btn{display:inline-flex;align-items:center;gap:6px;font:600 .86rem var(--body);color:var(--accent);background:transparent;text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:0 16px;min-height:44px;cursor:pointer}
.best{margin-top:10px;padding-top:8px;border-top:1px solid var(--line);font-size:.8rem;color:var(--muted)}
.best b{color:var(--accent);font-weight:600}
.day .w b{color:var(--accent);font-weight:600}
.day.bestday{box-shadow:inset 3px 0 0 var(--accent)}
.opstate{display:flex;align-items:center;gap:8px;font-size:.86rem;font-weight:600;flex-wrap:wrap}
.opstate .dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.opstate.on .dot{background:var(--up)}
.opstate em{font-style:normal;font-weight:500;font-size:.78rem;color:var(--warm)}
.card h2 small.stale{color:var(--warm)}
.camwrap{position:relative}
.cams{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 16px 10px;scroll-padding:0 16px;scrollbar-width:none;overscroll-behavior-x:contain}
.cams::-webkit-scrollbar{display:none}
.cam{flex:0 0 80%;scroll-snap-align:start;color:var(--fg);display:grid;gap:6px;background:none;border:0;padding:0;font:inherit;text-align:left;cursor:pointer}
.cam .frame{aspect-ratio:16/9;border-radius:10px;background:var(--accent-soft);border:1px solid var(--line);overflow:hidden}
.cam img{width:100%;height:100%;object-fit:cover;display:block}
.cam span{font-size:.8rem;color:var(--muted)}
.cam.err img{visibility:hidden}
.cam.err span::after{content:" · gerade nicht erreichbar"}
.camdots{display:flex;justify-content:center;gap:6px;padding:0 16px 14px}
.camdots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.camdots i.on{background:var(--accent)}
.camnav{position:absolute;top:calc(50% - 22px - 12px);width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:color-mix(in srgb,var(--surface) 85%,transparent);color:var(--fg);display:none;place-items:center;cursor:pointer;padding:0}
.camnav svg{width:18px;height:18px}
.camnav.prev{left:8px}.camnav.next{right:8px}
.camnav[hidden]{display:none!important}
@media (hover:hover) and (pointer:fine){.camnav{display:grid}}
.viewer{position:fixed;inset:0;z-index:50;background:#000;display:grid;grid-template-rows:auto 1fr;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.viewer[hidden]{display:none}
.vbar{display:flex;align-items:center;gap:12px;padding:8px 8px 8px 16px;color:#e9eef2;flex-wrap:wrap}
.vbar b{font-family:var(--display);font-weight:500}
.vbar span{font:400 .8rem var(--mono);color:#9fb0bd;flex:1}
.vclose{width:44px;height:44px;border-radius:50%;border:1px solid #2a3a46;background:transparent;color:#e9eef2;font-size:1.1rem;cursor:pointer}
.vstrip{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior:contain}
.vstrip::-webkit-scrollbar{display:none}
.vstrip figure{flex:0 0 100%;scroll-snap-align:center;margin:0;display:flex;flex-direction:column;justify-content:center;align-items:center;min-width:0;min-height:0}
.vimg{display:grid;place-items:center;min-height:0;width:100%}
.vimg img{max-width:100%;max-height:calc(100dvh - 150px);object-fit:contain;display:block}
.vimg.err::after{content:"Bild gerade nicht erreichbar";color:#9fb0bd;font-size:.9rem}
.vimg.err img{display:none}
.vstrip figcaption{padding:12px 16px 18px;color:#c9d4dc;font-size:.88rem;text-align:center}
.vstrip figcaption a{color:#8fcbf0}
.viewer .camnav{top:calc(50% - 22px);background:rgba(20,28,34,.8);border-color:#2a3a46;color:#e9eef2}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill.soft{background:transparent;border:1px solid var(--line);font-weight:500;color:var(--muted)}
.depthrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(8em,1fr));gap:8px 14px}
.nsblock{display:grid;gap:10px;padding-top:10px;border-top:1px solid var(--line)}
.depthrow > div{display:grid;gap:1px;min-width:0}
.depthrow .fl{font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-family:var(--mono)}
.depthrow .fv{font:500 1.12rem/1.2 var(--mono)}
.depthrow .fd{font-size:.72rem;color:var(--muted)}
.ovc .t span.r.inv{color:var(--warm)}
.hours{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;padding:4px 12px 8px}
.hc{display:grid;justify-items:center;gap:4px;padding:8px 2px;border-radius:10px;text-align:center}
.hc .hh{font:400 .72rem var(--mono);color:var(--muted)}
.hc .ht{font:500 .95rem var(--mono)}
.hc .hs{font-size:.7rem;color:var(--muted);line-height:1.2}
.wi{width:28px;height:28px;display:block}
.note b.sunsum{color:var(--warm);font-weight:600}
.hint{display:flex;align-items:center;gap:8px;padding:0 16px 12px;font-size:.82rem;color:var(--fg)}
.hint .wi{width:20px;height:20px;flex:none}
.sunbar{display:inline-block;width:38px;height:5px;border-radius:3px;background:var(--line);vertical-align:middle;margin-right:6px;overflow:hidden}
.sunbar i{display:block;height:100%;background:var(--warm);border-radius:3px}
.day .s small{display:block;font:400 .7rem var(--mono);color:var(--muted);text-align:right}
.chev{width:16px;height:16px;color:var(--muted);margin-left:4px;flex:none}
.legend i.dot{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.legend i.dash{width:16px;height:0;border-top:2px dashed var(--c,var(--muted));border-radius:0;background:none}
.legend i.solid{width:16px;height:0;border-top:2px solid var(--c,var(--snow));border-radius:0;background:none}
.note b.closed{color:var(--fg);font-weight:600}
.empty b{color:var(--fg);font-weight:600}
details summary .cnt{float:right;color:var(--muted);font:400 .78rem var(--mono)}
.item i{font-style:normal;color:var(--muted);font-size:.74rem;margin-left:8px}
details summary{cursor:pointer;padding:12px 16px;min-height:44px;border-top:1px solid var(--line);font-size:.86rem;color:var(--accent);list-style:none}
details summary::-webkit-details-marker{display:none}
.item{display:flex;justify-content:space-between;gap:10px;padding:7px 16px;font-size:.86rem;border-top:1px solid var(--line)}
.item .o{font:500 .78rem var(--mono)}.item .o.y{color:var(--up)}.item .o.n{color:var(--muted)}
[hidden]{display:none!important}
footer{font-size:.75rem;color:var(--muted);line-height:1.5}
footer a{color:var(--accent)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
</style>
<script>
  (function(){ var p = "gletscher"; try{ p = localStorage.getItem("ski-palette") || p; }catch(e){}
    if(p !== "gletscher") document.documentElement.setAttribute("data-palette", p); })();
</script>

<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow" id="eyebrow">Skigebiete</div>
      <h1>Ski aktuell</h1>
    </div>
    <div class="hbtns">
      <button class="refresh" id="refresh" type="button">Aktualisieren</button>
      <button class="pal-btn" id="palBtn" type="button" aria-label="Farben" aria-haspopup="true" aria-expanded="false"><span class="pal-dot"></span></button>
      <div class="pal-menu" id="palMenu" role="menu" hidden></div>
    </div>
  </header>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <div class="status" id="status"><span class="dot"></span><span id="statusText">Lädt …</span></div>
  <main id="main" class="ov"></main>
  <footer id="footer">
    Wetter, Neuschnee und Schneehöhe: <a href="https://open-meteo.com" rel="noopener">Open-Meteo</a> (Modellwerte, je Höhe berechnet).
    Lawinenlage: <a href="https://warnung.vorarlberg.at/vtgdb/dist/index.html#//lwd_lagebericht.html" rel="noopener">LWD Vorarlberg</a>.
    Lifte und Pisten: Angaben der Skigebiete. Alle Angaben ohne Gewähr – vor Touren abseits der Piste immer den vollständigen Lagebericht lesen.
  </footer>
</div>
<div id="viewer" class="viewer" role="dialog" aria-modal="true" aria-label="Webcams groß" hidden></div>
<script>
"use strict";
/* ---------- Grundlagen ---------- */
const HOURLY = "temperature_2m,snowfall,snow_depth,freezing_level_height,weather_code,wind_gusts_10m,cloud_cover,sunshine_duration,visibility,precipitation";
const DAILY = "weather_code,temperature_2m_max,temperature_2m_min,snowfall_sum,precipitation_sum,sunshine_duration,wind_gusts_10m_max,daylight_duration";
const CURRENT = "temperature_2m,weather_code,wind_gusts_10m,snowfall";
const PALETTES = [
  ["gletscher","Gletscher",["#0c1620","#7cc4ea","#cfe9f8"]],
  ["graphit","Graphit",["#111316","#7fb4ff","#dbe7ff"]],
  ["schwarz","Schwarz",["#000000","#5fb8f0","#d6ecfa"]],
  ["nacht","Nachtsicht (rot)",["#000000","#E8604F","#FF8A7C"]],
  ["hell","Hell",["#eef3f6","#1f6f9b","#10283a"]],
];
const LEVEL = {low:1, moderate:2, considerable:3, high:4, very_high:5};
const LEVEL_TXT = ["keine Einstufung","gering","mäßig","erheblich","groß","sehr groß"];
const PROBLEM = {new_snow:"Neuschnee", wind_slab:"Triebschnee", persistent_weak_layers:"Altschnee", wet_snow:"Nassschnee",
  gliding_snow:"Gleitschnee", cornices:"Wechten", favourable_situation:"Günstige Situation", no_distinct_avalanche_problem:"Kein ausgeprägtes Problem"};
const TEND = {increasing:"steigend", steady:"gleichbleibend", decreasing:"abnehmend"};
const PERIOD = {earlier:"vormittags", later:"nachmittags"};
const ASPECTS = ["N","NE","E","SE","S","SW","W","NW"];
const ASP_DE = {N:"N",NE:"NO",E:"O",SE:"SO",S:"S",SW:"SW",W:"W",NW:"NW"};
const WD = ["So","Mo","Di","Mi","Do","Fr","Sa"];
const REGION_DE = {"AT-08-01":"Bregenzerwaldgebirge","AT-08-02":"Allgäuer Alpen West","AT-08-03-01":"Lechtaler Alpen Vorarlberg",
  "AT-08-03-02":"Lechquellengebirge","AT-08-04":"Verwall West","AT-08-05-01":"Rätikon Ost","AT-08-05-02":"Rätikon West","AT-08-06":"Silvretta West","AT-08-07":"Voralpen"};

let LOADING = true, RES = [], WX = null, WX_LIVE = false, LAW = null, STAT = null, HIST = null, VIEW = "overview";
const $ = id => document.getElementById(id);
function load(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }
function save(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function esc(s){ return String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
const fmt0 = v => (v == null || !isFinite(v)) ? "–" : Math.round(v).toString();
const fmtT = v => (v == null || !isFinite(v)) ? "–" : (Math.round(v) === 0 ? "0" : Math.round(v).toString().replace("-", "−")) + "°";
const cm = v => (v == null || !isFinite(v)) ? "–" : (v > 0 && v < 1 ? "<1" : Math.round(v).toString());

function wxText(c){
  if(c == null) return "–";
  if(c === 0) return "Klar"; if(c === 1) return "Überwiegend klar"; if(c === 2) return "Teils bewölkt"; if(c === 3) return "Bedeckt";
  if(c === 45 || c === 48) return "Nebel"; if(c >= 51 && c <= 57) return "Nieselregen";
  if(c === 61) return "Leichter Regen"; if(c === 63) return "Regen"; if(c === 65) return "Starker Regen"; if(c === 66 || c === 67) return "Gefrierender Regen";
  if(c === 71) return "Leichter Schneefall"; if(c === 73) return "Schneefall"; if(c === 75) return "Starker Schnee"; if(c === 77) return "Schneegriesel";
  if(c >= 80 && c <= 82) return "Regenschauer"; if(c === 85) return "Schneeschauer"; if(c === 86) return "Kräftige Schneeschauer";
  if(c >= 95) return "Gewitter"; return "–";
}

/* ---------- Daten je Messpunkt ---------- */
function activeResorts(){ return RES.filter(r => r.aktiv !== false); }
function allPoints(){ return activeResorts().flatMap(r => r.points); }
function apiUrl(){
  const p = allPoints(), j = k => p.map(x => x[k]).join(",");
  return "https://api.open-meteo.com/v1/forecast?latitude=" + j("lat") + "&longitude=" + j("lon") + "&elevation=" + j("elev") +
    "&current=" + CURRENT + "&hourly=" + HOURLY + "&daily=" + DAILY + "&past_days=7&forecast_days=7&timezone=Europe%2FBerlin&wind_speed_unit=kmh";
}
function pointData(r, i){
  if(!WX) return null;
  let k = 0;
  for(const x of activeResorts()){ if(x === r) return WX[k + i] || null; k += x.points.length; }
  return null;
}
function nowIdx(d){
  const key = d.current.time.slice(0,13) + ":00", t = d.hourly.time;
  let i = t.indexOf(key);
  if(i < 0){ i = 0; while(i + 1 < t.length && t[i+1] <= d.current.time) i++; }
  return i;
}
function sumSnow(d, from, to){
  let s = 0; const a = d.hourly.snowfall;
  for(let i = Math.max(0, from); i <= Math.min(a.length - 1, to); i++) s += a[i] || 0;
  return s;
}
function pointStats(d){
  if(!d || !d.current || !d.hourly) return null;
  const i = nowIdx(d), h = d.hourly;
  const di = d.daily.time.indexOf(d.current.time.slice(0,10));
  return {
    i, di,
    temp: d.current.temperature_2m, code: d.current.weather_code, gust: d.current.wind_gusts_10m,
    past24: sumSnow(d, i-23, i), past72: sumSnow(d, i-71, i),
    next24: sumSnow(d, i+1, i+24), next72: sumSnow(d, i+1, i+72),
    depth: h.snow_depth[i] != null ? h.snow_depth[i] * 100 : null,
    freezing: h.freezing_level_height[i],
  };
}

/* ---------- Sonne und Tal ---------- */
function sunHours(d, k){ const v = d && d.daily && d.daily.sunshine_duration ? d.daily.sunshine_duration[k] : null; return v == null ? null : v / 3600; }
function daylightHours(d, k){ const v = d && d.daily && d.daily.daylight_duration ? d.daily.daylight_duration[k] : null; return v == null ? null : v / 3600; }
function talPoint(r){ return r.points.length > 1 ? pointData(r, 0) : null; }
// Hochnebel: laut Vorhersage im Tal kaum Sonne, am Berg deutlich mehr
function inversion(r, k){
  const b = sunHours(pointData(r, r.points.length - 1), k), t = sunHours(talPoint(r), k);
  return b != null && t != null && t < 1.5 && b >= 3 && b - t >= 2;
}
function hourKind(d, i){
  const H = d.hourly, c = H.weather_code[i];
  if((c >= 71 && c <= 77) || c === 85 || c === 86) return "snow";
  if((c >= 51 && c <= 67) || (c >= 80 && c <= 82)) return "rain";
  if(c === 45 || c === 48 || (H.visibility && H.visibility[i] != null && H.visibility[i] < 1000)) return "fog";
  const sun = H.sunshine_duration ? H.sunshine_duration[i] : null;
  if(sun != null) return sun >= 2160 ? "sun" : sun >= 720 ? "partly" : "cloud";
  const cc = H.cloud_cover ? H.cloud_cover[i] : 50;
  return cc < 30 ? "sun" : cc < 70 ? "partly" : "cloud";
}
const KIND_TXT = {sun:"sonnig", partly:"teils sonnig", cloud:"bewölkt", snow:"Schneefall", rain:"Regen", fog:"Nebel"};
function wxIcon(kind){
  const sun = `<circle cx="12" cy="12" r="4.2" fill="var(--warm)"/><g stroke="var(--warm)" stroke-width="1.6" stroke-linecap="round"><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></g>`;
  const cloud = (y, col) => `<path d="M7 ${18+y}h10.5a3.6 3.6 0 0 0 .4-7.2 5.2 5.2 0 0 0-10-1.1A3.9 3.9 0 0 0 7 ${18+y}z" fill="${col}"/>`;
  const g = {
    sun,
    partly: `<g transform="translate(-3,-3) scale(.8)">${sun}</g>` + cloud(1, "var(--muted)"),
    cloud: cloud(0, "var(--muted)"),
    snow: cloud(-3, "var(--muted)") + `<g fill="var(--snow)"><circle cx="8.5" cy="19.5" r="1.2"/><circle cx="12.5" cy="21" r="1.2"/><circle cx="16.5" cy="19.5" r="1.2"/></g>`,
    rain: cloud(-3, "var(--muted)") + `<g stroke="var(--cool)" stroke-width="1.6" stroke-linecap="round"><path d="M9 18.5l-1 2.5M13 18.5l-1 2.5M17 18.5l-1 2.5"/></g>`,
    fog: `<g stroke="var(--muted)" stroke-width="1.8" stroke-linecap="round"><path d="M4 9h16M6 13h12M4 17h16"/></g>`,
  }[kind];
  return `<svg class="wi" viewBox="0 0 24 24" aria-hidden="true">${g}</svg>`;
}
/* Tagesverlauf am Berg: heute, ab 15 Uhr morgen; 8 bis 16 Uhr im Zwei-Stunden-Takt */
function dayCourseHTML(r, d, s){
  if(!d.hourly.sunshine_duration && !d.hourly.cloud_cover) return "";
  const now = d.current.time, tomorrow = Number(now.slice(11,13)) >= 15;
  const k = s.di + (tomorrow ? 1 : 0); if(k < 0 || k >= d.daily.time.length) return "";
  const date = d.daily.time[k], P = r.points[r.points.length - 1];
  const cells = [8,10,12,14,16].map(hh => {
    const i = d.hourly.time.indexOf(date + "T" + String(hh).padStart(2,"0") + ":00"); if(i < 0) return "";
    const kind = hourKind(d, i), sn = sumSnow(d, i - 1, i);
    return `<div class="hc" title="${KIND_TXT[kind]}"><span class="hh">${hh} Uhr</span>${wxIcon(kind)}<span class="ht">${fmtT(d.hourly.temperature_2m[i])}</span><span class="hs">${sn >= 0.5 ? "+" + Math.max(1, Math.round(sn)) + " cm" : KIND_TXT[kind]}</span></div>`;
  }).join("");
  const sun = sunHours(d, k), day = daylightHours(d, k);
  let vis = "";
  if(d.hourly.visibility){
    let minV = Infinity; for(const hh of [9,10,11,12,13,14,15]){ const i = d.hourly.time.indexOf(date + "T" + String(hh).padStart(2,"0") + ":00"); if(i >= 0 && d.hourly.visibility[i] != null) minV = Math.min(minV, d.hourly.visibility[i]); }
    if(minV < 1000) vis = " · zeitweise Nebel, Sicht unter 1 km";
  }
  const inv = inversion(r, k) ? `<div class="hint">${wxIcon("sun")}Laut Vorhersage im Tal trüb, am Berg sonnig (Hochnebel).</div>` : "";
  return `<div class="card"><h2>${tomorrow ? "Morgen" : "Heute"} am Berg <small>${esc(P.name)} ${P.elev} m</small></h2>
    <div class="hours">${cells}</div>
    <div class="note">${sun != null ? `<b class="sunsum">${Math.round(sun)} h Sonne</b>${day ? " von " + Math.round(day) + " h Tageslicht" : ""}` : ""}${vis}</div>${inv}</div>`;
}

/* ---------- Bester Skitag ----------
   Punkte je Tag (heute bis +6): frischer Schnee vom Vortag und der Nacht (bis 45), Sonnenstunden (bis 35),
   wenig Wind (bis 20, starke Böen kosten Punkte), Abzug für Dauerschneefall, große Kälte und Lawinenstufe ≥ 4.
   Nur Tage mit genug Schnee am Berg (Modell ≥ 30 cm oder offene Lifte laut Skigebiet) zählen.
   Markiert wird der beste Tag, wenn er mindestens 50 Punkte erreicht. */
function bestDay(r){
  const top = r.points.length - 1, d = pointData(r, top), s = pointStats(d);
  if(!s || s.di < 1) return null;
  const D = d.daily, H = d.hourly, st = STAT && STAT[r.id];
  const liftsOpen = st && st.lifts && st.lifts.open > 0;
  let best = null;
  for(let k = s.di; k < Math.min(D.time.length, s.di + 7); k++){
    const hi = H.time.indexOf(D.time[k] + "T12:00"), depth = hi >= 0 ? (H.snow_depth[hi] || 0) * 100 : 0;
    if(depth < 30 && !(k === s.di && liftsOpen)) continue;
    const fresh = (D.snowfall_sum[k-1] || 0) + 0.5 * (D.snowfall_sum[k] || 0);
    const sun = (D.sunshine_duration[k] || 0) / 3600, gust = D.wind_gusts_10m_max[k] || 0;
    let p = Math.min(fresh, 30) / 30 * 45 + Math.min(sun, 8) / 8 * 35 + (gust < 40 ? 20 : gust < 60 ? 10 : gust < 80 ? -10 : -30);
    if((D.snowfall_sum[k] || 0) > 15) p -= 10;
    if((D.temperature_2m_max[k] ?? 0) < -15) p -= 5;
    const L = lawFor(r, D.time[k]); if(L && L.lv >= 4) p -= 15;
    if(!best || p > best.p) best = {k, p};
  }
  if(!best || best.p < 50) return null;
  const dt = new Date(D.time[best.k] + "T12:00:00");
  best.label = best.k === s.di ? "heute" : best.k === s.di + 1 ? "morgen" : WD[dt.getDay()] + " " + dt.getDate() + "." + (dt.getMonth()+1) + ".";
  return best;
}

/* ---------- Lawinenlage ---------- */
function todayStr(){ return new Date().toLocaleDateString("sv-SE", {timeZone:"Europe/Vienna"}); }
function lawFor(r, day){
  if(!LAW || !LAW.days || !r.lawine || !r.lawine.length) return null;
  const regions = LAW.days[day]; if(!regions) return null;
  let best = null;
  for(const want of r.lawine){
    for(const [id, e] of Object.entries(regions)){
      if(id !== want && !id.startsWith(want + "-")) continue;
      const lv = maxLevel(e);
      if(!best || lv > best.lv) best = {lv, e, id};
    }
  }
  return best;
}
function maxLevel(e){ return Math.max(0, ...e.ratings.map(x => LEVEL[x.value] || 0)); }
function elevTxt(el){
  if(!el) return "";
  if(el.lowerBound) return "über " + (el.lowerBound === "treeline" ? "der Waldgrenze" : el.lowerBound + " m");
  if(el.upperBound) return "unter " + (el.upperBound === "treeline" ? "der Waldgrenze" : el.upperBound + " m");
  return "";
}
function ratingDetail(e){
  const rs = e.ratings.filter(x => LEVEL[x.value]);
  if(rs.length <= 1) return "";
  return rs.map(x => [PERIOD[x.period], elevTxt(x.elevation)].filter(Boolean).join(", ") + ": " + LEVEL[x.value] + " " + LEVEL_TXT[LEVEL[x.value]]).join(" · ");
}

/* ---------- Darstellung ---------- */
function setView(v){
  VIEW = v; save("ski-view", v);
  try{ history.replaceState(null, "", v === "overview" ? location.pathname + location.search : "#" + v); }catch(e){}
  render(); window.scrollTo({top:0});
}
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if(h && h !== VIEW){ VIEW = h; render(); } });
function renderTabs(){
  const items = [["overview","Übersicht"], ...activeResorts().map(r => [r.id, r.name])];
  $("tabs").innerHTML = items.map(([id, n]) => `<button type="button" role="tab" data-v="${esc(id)}" aria-selected="${id === VIEW}">${esc(n)}</button>`).join("");
  $("tabs").querySelectorAll("button").forEach(b => b.onclick = () => setView(b.dataset.v));
  const sel = $("tabs").querySelector('[aria-selected="true"]'); if(sel) sel.scrollIntoView({block:"nearest", inline:"nearest"});
}
function render(){
  if(RES.length && VIEW !== "overview" && !activeResorts().some(r => r.id === VIEW)) VIEW = "overview";
  renderTabs();
  const cur = activeResorts().find(r => r.id === VIEW);
  $("main").innerHTML = VIEW === "overview" ? overviewHTML() : cur ? resortHTML(cur) : emptyHTML();
  $("main").querySelectorAll("[data-go]").forEach(b => b.onclick = () => setView(b.dataset.go));
  $("main").querySelectorAll("[data-retry]").forEach(b => b.onclick = () => refresh());
  if(cur) wireCams(cur);
  const first = WX && WX[0] && WX[0].current;
  $("eyebrow").textContent = "Skigebiete";
}
function lawBadge(r){
  const L = lawFor(r, todayStr());
  if(!L) return `<span class="lv lv0" role="img" aria-label="Lawinenstufe: noch kein Bericht">–</span>`;
  return `<span class="lv lv${L.lv}" role="img" aria-label="Lawinenstufe ${L.lv}, ${LEVEL_TXT[L.lv]}">${L.lv || "–"}</span>`;
}
function seasonStart(r){
  if(!r.saisonstart || todayStr() >= r.saisonstart) return null;
  const d = new Date(r.saisonstart + "T12:00:00");
  return d.getDate() + "." + (d.getMonth() + 1) + ".";
}
function reportAge(st){
  const t = st && (st.reported || null);
  if(!t) return null;
  const d = new Date(t); if(isNaN(d)) return null;
  const h = (Date.now() - d.getTime()) / 36e5;
  return h > 24 ? "Meldung vom " + d.getDate() + "." + (d.getMonth() + 1) + "." : null;
}
function opState(r){
  const st = STAT && STAT[r.id], start = seasonStart(r);
  if(start && (!st || allClosed(st))) return {cls:"off", txt:"Saisonstart am " + start};
  if(!st || !st.lifts || !st.lifts.total) return null;
  const age = reportAge(st);
  if(!st.lifts.open) return {cls:"off", txt:"Alle Lifte geschlossen", age};
  const sl = st.slopes && st.slopes.total ? " · " + fmt0(st.slopes.open) + " " + (st.slopes.unit === "km" ? "km" : "Pisten") : "";
  return {cls:"on", txt:"Offen · " + fmt0(st.lifts.open) + "/" + fmt0(st.lifts.total) + " Lifte" + sl, age};
}
function allClosed(st){ return !!(st && st.lifts && st.lifts.total && !st.lifts.open); }
function liftLine(r){
  const st = STAT && STAT[r.id], start = seasonStart(r);
  if(start && (!st || allClosed(st))) return "Saisonstart " + start;
  return st && st.lifts && st.lifts.total ? "Lifte " + fmt0(st.lifts.open) + "/" + fmt0(st.lifts.total) : "";
}
function reported(r){
  const st = STAT && STAT[r.id];
  return st && st.snow && st.snow.mountain > 0 ? st.snow : null;
}
// Schneehöhe Berg und Tal: Meldung des Skigebiets, wenn vorhanden, sonst Modell (Bergstation / unterster Punkt)
function depths(r){
  const rep = reported(r), b = pointStats(pointData(r, r.points.length - 1)), t = r.points.length > 1 ? pointStats(pointData(r, 0)) : null;
  if(rep) return {berg: rep.mountain, tal: rep.valley != null ? rep.valley : (t ? t.depth : null), src: "laut Skigebiet"};
  return {berg: b ? b.depth : null, tal: t ? t.depth : null, src: "Modell"};
}
function depthCell(r){
  const dp = depths(r);
  return `<div><div class="fl">Schneehöhe</div><div class="fv">${cm(dp.berg)}<small> cm</small></div><div class="fd">${dp.tal != null ? "Tal " + cm(dp.tal) + " cm" : "Berg"}${dp.src === "Modell" ? "" : " · gemeldet"}</div></div>`;
}
function emptyHTML(){
  if(LOADING) return `<div class="card"><div class="empty">Daten werden geladen …</div></div>`;
  return `<div class="card"><div class="empty"><b>Keine Daten erreichbar.</b><br>Prüfe die Internetverbindung.</div>
    <div class="pad" style="text-align:center"><button type="button" class="btn" data-retry>Erneut versuchen</button></div></div>`;
}
function overviewHTML(){
  if(!WX) return emptyHTML();
  return activeResorts().map(r => {
    const berg = pointStats(pointData(r, r.points.length - 1));
    const top = r.points[r.points.length - 1];
    return `<button type="button" class="ovc" data-go="${esc(r.id)}" aria-label="${esc(r.name)}: Details öffnen">
      <div class="t"><div><b>${esc(r.name)}</b><span class="r">${liftLine(r) || esc(r.region || "")}</span><span class="r">${berg ? fmtT(berg.temp) + " · " + wxText(berg.code) : "–"}${(() => { const d0 = pointData(r, r.points.length - 1), sh = berg ? sunHours(d0, berg.di) : null; return sh != null ? " · heute\u00a0" + Math.round(sh) + "\u00a0h\u00a0Sonne" : ""; })()}</span>${(() => { const b = pointStats(pointData(r, r.points.length - 1)); return b && inversion(r, b.di) ? `<span class="r inv">Im Tal trüb, oben Sonne</span>` : ""; })()}</div>
        <div class="lw">Lawine ${lawBadge(r)}<svg class="chev" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div>
      <div class="stats">
        ${depthCell(r)}
        <div><div class="fl">Neuschnee</div><div class="fv snow">${berg ? cm(berg.past24) : "–"}<small> cm</small></div><div class="fd">24 h · 72 h: ${berg ? cm(berg.past72) : "–"}</div></div>
        <div><div class="fl">Prognose</div><div class="fv">${berg ? "+" + cm(berg.next72) : "–"}<small> cm</small></div><div class="fd">nächste 3 Tage</div></div>
      </div>
      ${(() => { const b = bestDay(r); return b ? `<div class="best">Bester Skitag: <b>${b.label}</b></div>` : ""; })()}
    </button>`;
  }).join("") + `<p class="status" style="margin:2px 2px 0">Schneehöhe: Meldung des Skigebiets, sonst Modell. Neuschnee und Prognose sind Modellwerte für die Bergstation.</p>`;
}
function resortHTML(r){
  const top = r.points.length - 1, P = r.points[top];
  const d = pointData(r, top), s = pointStats(d);
  if(!s) return emptyHTML();
  const snowline = s.freezing != null ? Math.round(Math.max(0, s.freezing - 300) / 50) * 50 : null;
  const op = opState(r);
  let h = `<section class="hero">
    ${op ? `<div class="opstate ${op.cls}"><span class="dot"></span>${esc(op.txt)}${op.age ? `<em>${esc(op.age)}</em>` : ""}</div>` : ""}
    ${(() => { const dp = depths(r), T = r.points.length > 1 ? r.points[0] : null; return `<div class="depthrow">
      <div><span class="fl">Schneehöhe Berg</span><span class="fv">${cm(dp.berg)} cm</span><span class="fd">${esc(P.elev)} m · ${dp.src}</span></div>
      ${T ? `<div><span class="fl">Schneehöhe Tal</span><span class="fv">${cm(dp.tal)} cm</span><span class="fd">${esc(T.name)} ${T.elev} m · ${dp.src}</span></div>` : ""}</div>`; })()}
    <div class="nsblock">
      <div class="eyebrow">Neuschnee 24 h · ${esc(P.name)} ${P.elev} m</div>
      <div class="bigrow">
        <div class="big">${cm(s.past24)}<small>cm</small></div>
        <div class="fc"><span class="fl">Nächste 3 Tage</span><span class="fv">+${cm(s.next72)} cm</span><span class="fd">morgen +${cm(s.next24)} cm</span></div>
      </div>
    </div>
    <div class="pills"><span class="pill">${fmtT(s.temp)} · ${wxText(s.code)}${(() => { const sh = sunHours(d, s.di); return sh != null ? " · heute " + Math.round(sh) + " h Sonne" : ""; })()}</span>${snowline != null ? `<span class="pill soft">Schneefallgrenze ~${snowline} m</span>` : ""}</div>
  </section>`;
  h += dayCourseHTML(r, d, s);
  h += lawineHTML(r);
  h += `<div class="card"><h2>Jetzt <small>nach Höhe</small></h2>` + r.points.map((p, i) => {
    const q = pointStats(pointData(r, i)); if(!q) return "";
    return `<div class="row"><div class="lbl">${esc(p.name)}<span>${p.elev} m · ${wxText(q.code)}</span></div>

let VIEWER_CLOSE = null;
function openViewer(r, start, opener){
  const cams = r.webcams, v = $("viewer"), page = document.querySelector(".wrap");
  v.innerHTML = `<div class="vbar"><b>${esc(r.name)}</b><span data-vcount aria-live="polite"></span><button type="button" class="vclose" data-vclose aria-label="Schließen">✕</button></div>
    <div class="vstrip" data-vstrip>` + cams.map(c => `<figure><div class="vimg"><img src="${esc(camSrc(c, true))}" alt="Webcam ${esc(c.name)}" decoding="async" onerror="this.parentNode.classList.add('err')"></div>
      <figcaption>${esc(c.name)}${c.link ? ` · <a href="${esc(c.link)}" target="_blank" rel="noopener">Webcam-Seite ↗</a>` : ""}</figcaption></figure>`).join("") + `</div>
    ${cams.length > 1 ? `<button type="button" class="camnav prev" data-vstep="-1" aria-label="Vorherige Webcam">${CHEV_L}</button><button type="button" class="camnav next" data-vstep="1" aria-label="Nächste Webcam">${CHEV_R}</button>` : ""}`;
  v.hidden = false; document.body.style.overflow = "hidden"; page.inert = true;
  const strip = v.querySelector("[data-vstrip]"), count = v.querySelector("[data-vcount]"), figs = [...strip.children];
  const prev = v.querySelector(".prev"), next = v.querySelector(".next");
  const cur = () => Math.max(0, Math.min(cams.length - 1, Math.round(strip.scrollLeft / strip.clientWidth)));
  const go = k => strip.scrollTo({left: Math.max(0, Math.min(cams.length - 1, k)) * strip.clientWidth, behavior: "smooth"});
  const show = () => {
    const k = cur();
    count.textContent = cams.length > 1 ? (k + 1) + " / " + cams.length : "";
    figs.forEach((f, i) => { f.inert = i !== k; });
    if(prev){ prev.hidden = k === 0; next.hidden = k === cams.length - 1; }
  };
  strip.addEventListener("scroll", show, {passive:true});
  requestAnimationFrame(() => { strip.scrollLeft = start * strip.clientWidth; show(); });
  v.querySelectorAll("[data-vstep]").forEach(b => b.onclick = () => go(cur() + Number(b.dataset.vstep)));

  try{ history.pushState({viewer:true}, ""); }catch(e){}
  const onPop = () => close(true);
  window.addEventListener("popstate", onPop);
  const key = e => {
    if(e.key === "Tab"){
      const f = [...v.querySelectorAll("button:not([hidden]), a[href]")].filter(x => !x.closest("[inert]"));
      if(!f.length) return;
      const i = f.indexOf(document.activeElement);
      if(e.shiftKey && i <= 0){ e.preventDefault(); f[f.length - 1].focus(); }
      else if(!e.shiftKey && i === f.length - 1){ e.preventDefault(); f[0].focus(); }
    }

    else if(e.key === "ArrowLeft") go(cur() - 1);
  };
  document.addEventListener("keydown", key);
  // Tipp auf die schwarze Fläche schließt (nicht auf Bild, Link oder Knöpfe)
  strip.addEventListener("click", e => { if(!e.target.closest("img, a")) close(); });
  // Wischen nach unten schließt
  let y0 = null, x0 = null;
  strip.addEventListener("touchstart", e => { y0 = e.touches[0].clientY; x0 = e.touches[0].clientX; }, {passive:true});
  strip.addEventListener("touchend", e => {
    if(y0 == null) return;
    const dy = e.changedTouches[0].clientY - y0, dx = Math.abs(e.changedTouches[0].clientX - x0);
    y0 = null; if(dy > 90 && dx < 50) close();
  }, {passive:true});
  function close(fromPop){
    if(v.hidden) return;
    v.hidden = true; v.innerHTML = ""; document.body.style.overflow = ""; page.inert = false;
    document.removeEventListener("keydown", key); window.removeEventListener("popstate", onPop);
    VIEWER_CLOSE = null;
    if(!fromPop){ try{ if(history.state && history.state.viewer) history.back(); }catch(e){} }
    if(opener) opener.focus({preventScroll:true});
  }
  VIEWER_CLOSE = close;
  v.querySelector("[data-vclose]").onclick = () => close();

}

  const X = d => pl + (Date.parse(d) - t0) / span * (W - pl - pr), Y = v => H - pb - v / max * (H - pt - pb);

  for(const sr of series) svg += `<path d="${line(sr.key)}" fill="none" stroke="${sr.col}" stroke-width="${sr.rep ? 2 : 1.6}"${sr.rep ? "" : ' stroke-dasharray="4 3"'}/>`;

async function getJSON(url, ms = 15000){
  const ctrl = new AbortController(), to = setTimeout(() => ctrl.abort(), ms);
  try{ const r = await fetch(url, {signal: ctrl.signal, cache: "no-store"}); if(!r.ok) throw new Error("HTTP " + r.status); return await r.json(); }
  finally{ clearTimeout(to); }
}
const valid = w => Array.isArray(w) && w.length === allPoints().length && w.every(x => x && x.current && x.hourly && x.daily);
async function refresh(){
  LOADING = true; if(!WX) render();
  $("refresh").disabled = true;
  try{
    const cfg = await getJSON("resorts.json?t=" + Date.now());
    RES = cfg.resorts || []; save("ski-resorts", RES);
  }catch(e){ RES = load("ski-resorts") || RES; }
  const [w, l, st, hi] = await Promise.allSettled([
    (async () => { try{ let x = await getJSON(apiUrl()); if(!Array.isArray(x)) x = [x]; if(valid(x)) return {x, live:true}; }catch(e){}
                   const f = await getJSON("weather.json?t=" + Date.now()); if(valid(f)) return {x:f, live:false}; throw new Error("kein Wetter"); })(),
    getJSON("lawine.json?t=" + Date.now()),
    getJSON("status.json?t=" + Date.now()),
    getJSON("history.json?t=" + Date.now()),
  ]);
  if(w.status === "fulfilled"){ WX = w.value.x; WX_LIVE = w.value.live; save("ski-wx", WX); }
  else { const c = load("ski-wx"); WX = valid(c) ? c : null; WX_LIVE = false; }
  if(l.status === "fulfilled"){ LAW = l.value; save("ski-law", LAW); } else LAW = load("ski-law");
  if(st.status === "fulfilled"){ STAT = st.value; save("ski-stat", STAT); } else STAT = load("ski-stat");
  if(hi.status === "fulfilled"){ HIST = hi.value; save("ski-hist", HIST); } else HIST = load("ski-hist");
  const ok = !!WX && WX_LIVE;
  $("status").classList.toggle("stale", !ok);
  const wt = WX && WX[0] && WX[0].current ? WX[0].current.time : null;
  $("statusText").textContent = !WX ? "Keine Daten erreichbar" :
    (WX_LIVE ? "Live" : "Gespeicherte Daten") + (wt ? " · Wetter von " + (wt.slice(0,10) === new Date().toLocaleDateString("sv-SE") ? "" : Number(wt.slice(8,10)) + "." + Number(wt.slice(5,7)) + ". ") + wt.slice(11,16) + " Uhr" : "");
  LOADING = false;
  render();
  $("refresh").disabled = false;
}
$("refresh").onclick = refresh;
VIEW = location.hash.slice(1) || load("ski-view") || "overview";
RES = load("ski-resorts") || [];
buildPalette();
refresh();
setInterval(() => { if(document.visibilityState === "visible") refresh(); }, 15 * 60 * 1000);
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible") refresh(); });
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
